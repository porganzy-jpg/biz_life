services:
  promomap-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promomap
      POSTGRES_USER: promomap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-promomap_dev_2024}
    volumes:
      - promomap_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promomap"]
      interval: 5s
      timeout: 3s
      retries: 5

  promomap-api:
    build:
      context: .
      dockerfile: Dockerfile.promomap
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://promomap:${DB_PASSWORD:-promomap_dev_2024}@promomap-db:5432/promomap
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-this-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:3000,https://your-domain.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      promomap-db:
        condition: service_healthy

volumes:
  promomap_pgdata:
