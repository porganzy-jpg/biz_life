<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PromoMap - 내 주변 할인 혜택</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <!-- 로딩 스켈레톤 -->
    <div id="skeleton" class="skeleton-container">
        <div class="skeleton-topbar"></div>
        <div class="skeleton-map"></div>
        <div class="skeleton-panel">
            <div class="skeleton-line w60"></div>
            <div class="skeleton-line w80"></div>
            <div class="skeleton-line w40"></div>
        </div>
    </div>

    <!-- 앱 컨테이너 -->
    <div id="app" style="display:none;">
        <!-- 상단 바 -->
        <div class="top-bar">
            <div class="logo">PromoMap</div>
            <div class="search-wrapper" id="searchWrapper">
                <input class="search-bar" placeholder="매장, 브랜드 검색..." id="searchInput" autocomplete="off" />
                <div class="search-suggestions" id="searchSuggestions" style="display:none;"></div>
            </div>
            <button class="filter-btn" id="searchBtn">검색</button>
        </div>

        <!-- 카테고리 필터 -->
        <div class="category-filter-bar" id="categoryFilterBar">
            <div class="category-chips" id="categoryChips">
                <button class="category-chip active" data-category="all">전체</button>
                <button class="category-chip" data-category="food">음식점</button>
                <button class="category-chip" data-category="cafe">카페</button>
                <button class="category-chip" data-category="shopping">쇼핑</button>
                <button class="category-chip" data-category="convenience">편의점</button>
                <button class="category-chip" data-category="entertainment">엔터</button>
                <button class="category-chip" data-category="general">기타</button>
            </div>
        </div>

        <!-- 지도 영역 -->
        <div class="map-area" id="mapArea">
            <div id="kakaoMap" style="width:100%;height:100%;"></div>
        </div>

        <!-- 검색 탭 -->
        <div class="tab-content" id="tabSearch" style="display:none;">
            <div class="search-results" id="searchResults">
                <div class="empty-state">매장을 검색해보세요</div>
            </div>
        </div>

        <!-- 즐겨찾기 탭 -->
        <div class="tab-content" id="tabFavorites" style="display:none;">
            <div class="tab-header">
                <h2>즐겨찾기</h2>
            </div>
            <div id="favoritesList">
                <div class="empty-state">즐겨찾기한 매장이 없습니다</div>
            </div>
        </div>

        <!-- 마이페이지 탭 -->
        <div class="tab-content" id="tabMypage" style="display:none;">
            <div id="mypageContent"></div>
        </div>

        <!-- 바텀시트 (지도 탭에서만 표시) -->
        <div class="promo-panel" id="promoPanel">
            <div class="promo-handle" id="promoHandle"><div class="promo-handle-bar"></div></div>

            <!-- 인기 할인 캐러셀 -->
            <div class="trending-section" id="trendingSection">
                <div class="trending-header">
                    <span class="trending-title">&#x1F525; 인기 할인</span>
                    <span class="trending-subtitle">최근 7일 기준</span>
                </div>
                <div class="trending-carousel" id="trendingCarousel">
                    <div class="loading-text" style="font-size:0.8rem;">인기 할인 로딩 중...</div>
                </div>
            </div>

            <!-- 핫딜 섹션 -->
            <div class="hot-deals-section" id="hotDealsSection">
                <div class="trending-header">
                    <span class="trending-title">&#x26A1; 핫딜</span>
                    <span class="trending-subtitle">절약 속도 TOP</span>
                </div>
                <div id="hotDealsList">
                    <div class="loading-text" style="font-size:0.8rem;">핫딜 로딩 중...</div>
                </div>
            </div>

            <!-- 인기 매장 섹션 -->
            <div class="popular-stores-section" id="popularStoresSection">
                <div class="trending-header">
                    <span class="trending-title">&#x2B50; 인기 매장</span>
                    <span class="trending-subtitle">리뷰 + 평점 + 이용량</span>
                </div>
                <div id="popularStoresList">
                    <div class="loading-text" style="font-size:0.8rem;">인기 매장 로딩 중...</div>
                </div>
            </div>

            <div class="promo-header">
                <div>
                    <div class="title" id="promoTitle">주변 할인 혜택</div>
                    <div class="subtitle" id="promoSubtitle">위치를 확인 중...</div>
                </div>
            </div>
            <div class="promo-sort-controls" id="promoSortControls">
                <label for="promoSortSelect" class="sort-label">정렬:</label>
                <select id="promoSortSelect" class="sort-select">
                    <option value="nearest">가까운순</option>
                    <option value="discount">할인율순</option>
                    <option value="expiring">마감임박순</option>
                    <option value="popular">인기순</option>
                </select>
            </div>
            <div class="promo-list" id="promoList">
                <div class="loading-text">매장 정보를 불러오는 중...</div>
            </div>
        </div>

        <!-- 매장 상세 모달 -->
        <div class="modal-overlay" id="storeModal" style="display:none;">
            <div class="modal-content store-detail-modal">
                <div class="modal-header">
                    <h3 id="modalStoreName">매장명</h3>
                    <button class="modal-close" onclick="closeStoreModal()">&times;</button>
                </div>
                <div class="modal-body" id="modalStoreBody"></div>
            </div>
        </div>

        <!-- 인증 모달 -->
        <div class="modal-overlay" id="authModal" style="display:none;">
            <div class="modal-content auth-modal">
                <div class="modal-header">
                    <h3 id="authModalTitle">로그인</h3>
                    <button class="modal-close" onclick="closeAuthModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <!-- 로그인 폼 -->
                    <form id="loginForm" onsubmit="return handleLogin(event)">
                        <div class="form-group">
                            <label>이메일</label>
                            <input type="email" id="loginEmail" required placeholder="email@example.com">
                        </div>
                        <div class="form-group">
                            <label>비밀번호</label>
                            <input type="password" id="loginPassword" required placeholder="비밀번호">
                        </div>
                        <button type="submit" class="btn-primary btn-full">로그인</button>
                        <p class="form-link">계정이 없으신가요? <a href="#" onclick="showRegisterForm()">회원가입</a></p>
                    </form>
                    <!-- 회원가입 폼 -->
                    <form id="registerForm" style="display:none;" onsubmit="return handleRegister(event)">
                        <div class="form-group">
                            <label>이름</label>
                            <input type="text" id="regName" required placeholder="이름">
                        </div>
                        <div class="form-group">
                            <label>이메일</label>
                            <input type="email" id="regEmail" required placeholder="email@example.com">
                        </div>
                        <div class="form-group">
                            <label>비밀번호</label>
                            <input type="password" id="regPassword" required minlength="6" placeholder="6자리 이상">
                        </div>
                        <div class="form-group">
                            <label>전화번호</label>
                            <input type="tel" id="regPhone" placeholder="010-0000-0000">
                        </div>
                        <div class="form-group">
                            <label>회사 코드 (선택)</label>
                            <input type="text" id="regCompanyCode" placeholder="예: CJ001">
                        </div>
                        <button type="submit" class="btn-primary btn-full">회원가입</button>
                        <p class="form-link">이미 계정이 있으신가요? <a href="#" onclick="showLoginForm()">로그인</a></p>
                    </form>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 -->
        <div class="bottom-nav">
            <div class="nav-item active" data-tab="map" onclick="switchTab('map')">
                <span class="ni">&#x1F4CD;</span><span>지도</span>
            </div>
            <div class="nav-item" data-tab="search" onclick="switchTab('search')">
                <span class="ni">&#x1F50D;</span><span>검색</span>
            </div>
            <div class="nav-item" data-tab="favorites" onclick="switchTab('favorites')">
                <span class="ni">&#x2764;</span><span>즐겨찾기</span>
            </div>
            <div class="nav-item" data-tab="mypage" onclick="switchTab('mypage')">
                <span class="ni">&#x1F464;</span><span>My</span>
            </div>
        </div>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- 카카오맵 SDK -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_api_key }}&libraries=services"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/favorites.js"></script>
    <script src="/static/js/mypage.js"></script>
    <script src="/static/js/trending.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
