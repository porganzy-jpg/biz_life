<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoMap Admin - 로그인</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1>PromoMap</h1>
                <p>관리자 로그인</p>
            </div>
            <form id="loginForm" onsubmit="return handleAdminLogin(event)">
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="email" required placeholder="admin@promomap.com">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" required placeholder="비밀번호">
                </div>
                <div id="errorMsg" class="error-msg" style="display:none;"></div>
                <button type="submit" class="btn-login">로그인</button>
            </form>
            <p class="login-hint">기본 계정: admin@promomap.com / admin1234</p>
        </div>
    </div>
    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'none';
            try {
                const res = await fetch('/admin/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password}),
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorEl.textContent = data.detail || '로그인 실패';
                    errorEl.style.display = 'block';
                }
            } catch {
                errorEl.textContent = '서버 연결 실패';
                errorEl.style.display = 'block';
            }
            return false;
        }
    </script>
</body>
</html>
