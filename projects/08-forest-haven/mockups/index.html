<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Forest Haven - 숲의 안식처</title>
<style>
:root{--forest-dark:#1a3a1a;--forest:#2d5a27;--forest-light:#4a8c3f;--wood-dark:#5c3d2e;--wood:#8b6914;--wood-light:#c9a96e;--gold:#d4a843;--gold-light:#f0d78c;--cream:#f5f0e1;--cream-dark:#e8dcc8;--text:#2c1810;--text-light:#6b5040;--white:#fff;--common:#9e9e9e;--uncommon:#4caf50;--rare:#2196f3;--epic:#9c27b0;--legendary:#ff9800;--mythic:#e91e63;--danger:#e74c3c;--success:#27ae60;--nav-h:60px;--top-h:50px;--radius:12px;--radius-sm:8px;--shadow:0 2px 8px rgba(0,0,0,.15);--shadow-lg:0 4px 20px rgba(0,0,0,.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--forest-dark);color:var(--text);overflow:hidden;height:100vh;width:100vw;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;max-width:430px;height:100vh;margin:0 auto;background:var(--cream);overflow:hidden;display:flex;flex-direction:column}
#topbar{height:var(--top-h);background:linear-gradient(135deg,var(--forest-dark),var(--forest));color:var(--cream);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:100;flex-shrink:0}
.tb-level{background:var(--gold);color:var(--wood-dark);font-weight:700;font-size:13px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tb-resources{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.tb-resources::-webkit-scrollbar{display:none}
.tb-res{display:flex;align-items:center;gap:2px;font-size:11px;background:rgba(255,255,255,.12);padding:2px 6px;border-radius:8px;white-space:nowrap}
.tb-res span{font-weight:600}
.tb-btn{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:var(--cream);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;transform:translateX(20px);-webkit-overflow-scrolling:touch}
.screen.active{opacity:1;pointer-events:auto;transform:translateX(0)}
.scr-pad{padding:16px 16px 20px}
.scr-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:12px}
.scr-sub{font-size:13px;color:var(--text-light);margin-bottom:16px}
#navbar{height:var(--nav-h);background:linear-gradient(0deg,var(--wood-dark),#6b4930);display:flex;align-items:stretch;z-index:100;flex-shrink:0;border-top:2px solid var(--wood-light)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream-dark);font-size:10px;font-weight:500;cursor:pointer;transition:all .2s;position:relative}
.nav-item .ni-icon{font-size:22px;transition:transform .2s}
.nav-item.active{color:var(--gold-light)}
.nav-item.active .ni-icon{transform:scale(1.15)}
.nav-item.active::after{content:'';position:absolute;top:-2px;left:20%;right:20%;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
.home-hero{position:relative;height:200px;border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.home-hero img{width:100%;height:100%;object-fit:cover}
.home-hero-overlay{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.7));display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.home-hero-title{color:var(--white);font-size:24px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.home-hero-sub{color:var(--cream-dark);font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.home-btn{background:var(--white);border-radius:var(--radius);padding:14px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;border:1px solid var(--cream-dark)}
.home-btn:active{transform:scale(.95)}
.home-btn .hb-icon{font-size:28px;margin-bottom:4px}
.home-btn .hb-label{font-size:11px;font-weight:600;color:var(--text)}
.home-news{background:var(--white);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.home-news h3{font-size:14px;margin-bottom:8px;color:var(--forest)}
.news-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--cream-dark);font-size:12px;color:var(--text-light)}
.news-item:last-child{border:none}
.scanner-viewport{position:relative;width:100%;aspect-ratio:1;background:#000;border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.scanner-frame{position:absolute;inset:15%;border:2px solid var(--gold);border-radius:8px}
.scanner-line{position:absolute;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,var(--forest-light),transparent);top:50%;animation:scanLine 2s ease-in-out infinite}
@keyframes scanLine{0%,100%{top:15%;opacity:.5}50%{top:85%;opacity:1}}
.scanner-corners{position:absolute;inset:14%}
.scanner-corners::before,.scanner-corners::after{content:'';position:absolute;width:20px;height:20px;border-color:var(--gold-light);border-style:solid}
.scanner-corners::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.scanner-corners::after{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.sc-bl{position:absolute;inset:14%}
.sc-bl::before,.sc-bl::after{content:'';position:absolute;width:20px;height:20px;border-color:var(--gold-light);border-style:solid}
.sc-bl::before{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.sc-bl::after{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-input-area{display:flex;gap:8px;margin-bottom:12px}
.scan-input{flex:1;height:44px;border:2px solid var(--cream-dark);border-radius:var(--radius-sm);padding:0 12px;font-size:15px;background:var(--white);color:var(--text);outline:none;transition:border-color .2s}
.scan-input:focus{border-color:var(--forest-light)}
.scan-btn{height:44px;padding:0 20px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--forest),var(--forest-light));color:var(--white);font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s}
.scan-btn:active{transform:scale(.95)}
.scan-history{background:var(--white);border-radius:var(--radius);padding:12px}
.scan-history h3{font-size:14px;margin-bottom:8px;color:var(--forest)}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card-grid-item{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s}
.card-grid-item:active{transform:scale(.96)}
.card-grid-img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--cream-dark)}
.card-grid-info{padding:8px;background:var(--white)}
.card-grid-name{font-size:12px;font-weight:700}
.card-grid-sub{font-size:10px;color:var(--text-light);margin-top:2px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px}
.tab-bar{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 16px;border:none;border-radius:20px;background:var(--cream-dark);color:var(--text-light);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-btn.active{background:var(--forest);color:var(--white)}
.glow-common{box-shadow:0 0 8px rgba(158,158,158,.3)}
.glow-uncommon{box-shadow:0 0 10px rgba(76,175,80,.4)}
.glow-rare{box-shadow:0 0 12px rgba(33,150,243,.5);animation:glowPulse 2.5s ease-in-out infinite}
.glow-epic{box-shadow:0 0 15px rgba(156,39,176,.5);animation:glowPulse 2s ease-in-out infinite}
.glow-legendary{box-shadow:0 0 18px rgba(255,152,0,.6);animation:glowRainbow 3s linear infinite}
.glow-mythic{box-shadow:0 0 22px rgba(233,30,99,.7);animation:glowRainbow 2s linear infinite}
@keyframes glowPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
@keyframes glowRainbow{0%{box-shadow:0 0 18px rgba(255,0,0,.5)}16%{box-shadow:0 0 18px rgba(255,165,0,.5)}33%{box-shadow:0 0 18px rgba(255,255,0,.5)}50%{box-shadow:0 0 18px rgba(0,255,0,.5)}66%{box-shadow:0 0 18px rgba(0,100,255,.5)}83%{box-shadow:0 0 18px rgba(148,0,211,.5)}100%{box-shadow:0 0 18px rgba(255,0,0,.5)}}
.holo-card{position:relative;overflow:hidden}
.holo-card::before{content:'';position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.3) 40%,rgba(255,220,150,.2) 50%,rgba(150,220,255,.2) 55%,transparent 70%);transform:rotate(25deg);animation:holoShine 3s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes holoShine{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(100%) rotate(25deg)}}
#card-discover{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
#card-discover.show{opacity:1;pointer-events:auto}
.discover-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.discover-grade{font-size:20px;font-weight:700;margin-top:20px;text-transform:uppercase;letter-spacing:2px}
.discover-name{font-size:28px;font-weight:700;color:var(--white);margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.discover-tap{color:rgba(255,255,255,.5);font-size:13px;margin-top:30px;animation:fadeInOut 2s infinite}
@keyframes fadeInOut{0%,100%{opacity:.3}50%{opacity:.8}}
#card-detail{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
#card-detail.show{opacity:1;pointer-events:auto}
.detail-sheet{width:100%;max-width:430px;max-height:85vh;background:var(--cream);border-radius:20px 20px 0 0;padding:20px;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
#card-detail.show .detail-sheet{transform:translateY(0)}
.detail-handle{width:40px;height:4px;background:var(--cream-dark);border-radius:2px;margin:0 auto 16px}
.detail-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);margin-bottom:16px}
.detail-name{font-size:22px;font-weight:700}
.detail-type{font-size:13px;color:var(--text-light);margin-top:4px}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-box{background:var(--white);border-radius:var(--radius-sm);padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat-val{font-size:20px;font-weight:700;color:var(--forest)}
.stat-label{font-size:10px;color:var(--text-light);margin-top:2px}
.detail-lore{background:var(--white);border-radius:var(--radius-sm);padding:14px;margin-top:12px;font-size:13px;line-height:1.6;color:var(--text-light);border-left:3px solid var(--forest-light)}
.cabin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.floor-tabs{display:flex;gap:4px}
.floor-tab{padding:6px 12px;border:none;border-radius:var(--radius-sm);background:var(--cream-dark);color:var(--text-light);font-size:12px;font-weight:600;cursor:pointer}
.floor-tab.active{background:var(--wood-dark);color:var(--cream)}
#cabin-canvas{width:100%;height:320px;border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer}
.room-card{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.room-card:active{transform:scale(.98)}
.room-card.locked{opacity:.5;filter:grayscale(.5)}
.room-icon{font-size:32px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:var(--cream);border-radius:var(--radius-sm)}
.room-info{flex:1}
.room-name{font-size:14px;font-weight:700}
.room-desc{font-size:11px;color:var(--text-light);margin-top:2px}
.room-prod{display:flex;align-items:center;gap:4px;margin-top:4px}
.room-res{font-size:11px;background:var(--cream);padding:2px 6px;border-radius:4px;font-weight:600}
#room-detail{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
#room-detail.show{opacity:1;pointer-events:auto}
.room-sheet{width:100%;max-width:430px;max-height:85vh;background:var(--cream);border-radius:20px 20px 0 0;overflow:hidden;transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
#room-detail.show .room-sheet{transform:translateY(0)}
.room-bg{width:100%;height:180px;object-fit:cover;display:block}
.room-body{padding:16px}
.room-title{font-size:20px;font-weight:700}
.room-level{font-size:12px;color:var(--text-light);margin-top:2px}
.room-creatures-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.room-creature-slot{aspect-ratio:1;border-radius:var(--radius-sm);background:var(--cream-dark);border:2px dashed var(--wood-light);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--wood-light);cursor:pointer;overflow:hidden}
.room-creature-slot img{width:100%;height:100%;object-fit:cover}
.room-upgrade-btn{width:100%;padding:14px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--forest),var(--forest-light));color:var(--white);font-weight:700;font-size:14px;margin-top:14px;cursor:pointer}
.landmark-card{display:flex;gap:12px;background:var(--white);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.landmark-card:active{transform:scale(.98)}
.landmark-img{width:120px;min-height:100px;object-fit:cover;flex-shrink:0}
.landmark-info{padding:12px;flex:1;display:flex;flex-direction:column;justify-content:center}
.landmark-flag{font-size:11px;color:var(--text-light)}
.landmark-name{font-size:15px;font-weight:700;margin-top:2px}
.landmark-desc{font-size:11px;color:var(--text-light);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.landmark-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--cream);color:var(--forest);font-weight:600;margin-top:6px}
#region-visit{position:fixed;inset:0;z-index:300;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#region-visit.show{opacity:1;pointer-events:auto}
.region-bg{position:absolute;inset:0}
.region-bg img{width:100%;height:100%;object-fit:cover}
.region-overlay{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.8));display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.region-name{color:var(--white);font-size:28px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.region-country{color:var(--cream-dark);font-size:14px;margin-top:4px}
.region-actions{display:flex;gap:8px;margin-top:16px}
.region-btn{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:13px;cursor:pointer;transition:transform .15s}
.region-btn:active{transform:scale(.95)}
.region-btn-primary{background:var(--forest-light);color:var(--white)}
.region-btn-secondary{background:rgba(255,255,255,.2);color:var(--white);backdrop-filter:blur(4px)}
.region-close{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:var(--white);font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}
.region-cards{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.region-cards::-webkit-scrollbar{display:none}
.region-mini-card{width:80px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;background:var(--white);box-shadow:var(--shadow)}
.region-mini-card img{width:100%;aspect-ratio:1;object-fit:cover}
.region-mini-card .rmc-name{font-size:9px;padding:4px;text-align:center;font-weight:600}
.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res-card{background:var(--white);border-radius:var(--radius-sm);padding:12px;text-align:center;box-shadow:var(--shadow)}
.res-icon{font-size:28px}
.res-name{font-size:11px;color:var(--text-light);margin-top:4px}
.res-amount{font-size:18px;font-weight:700;color:var(--text);margin-top:2px}
.recipe-card{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.recipe-icon{font-size:32px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:var(--cream);border-radius:var(--radius-sm)}
.recipe-info{flex:1}
.recipe-name{font-size:14px;font-weight:700}
.recipe-mats{font-size:11px;color:var(--text-light);margin-top:2px}
.recipe-craft{padding:8px 16px;border:none;border-radius:var(--radius-sm);background:var(--forest);color:var(--white);font-weight:600;font-size:12px;cursor:pointer;transition:transform .15s}
.recipe-craft:active{transform:scale(.95)}
.recipe-craft:disabled{background:var(--cream-dark);color:var(--text-light);cursor:not-allowed}
.profile-header{text-align:center;padding:20px;background:linear-gradient(135deg,var(--forest-dark),var(--forest));border-radius:var(--radius);color:var(--white);margin-bottom:16px}
.profile-avatar{width:80px;height:80px;border-radius:50%;border:3px solid var(--gold);margin:0 auto 10px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:36px}
.profile-name{font-size:20px;font-weight:700}
.profile-title{font-size:12px;color:var(--cream-dark);margin-top:4px}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ps-item{text-align:center}
.ps-val{font-size:18px;font-weight:700}
.ps-label{font-size:10px;color:var(--cream-dark)}
.achieve-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.achieve-item{background:var(--white);border-radius:var(--radius-sm);padding:10px;text-align:center;box-shadow:var(--shadow)}
.achieve-item.locked{opacity:.35}
.achieve-icon{font-size:24px}
.achieve-name{font-size:9px;color:var(--text-light);margin-top:4px}
.settings-group{background:var(--white);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--cream-dark)}
.settings-item:last-child{border:none}
.si-label{font-size:14px;font-weight:500}
.si-toggle{width:44px;height:24px;border-radius:12px;background:var(--cream-dark);border:none;position:relative;cursor:pointer;transition:background .2s}
.si-toggle.on{background:var(--forest-light)}
.si-toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--white);box-shadow:var(--shadow);transition:transform .2s}
.si-toggle.on::after{transform:translateX(20px)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--wood-dark);color:var(--cream);padding:10px 24px;border-radius:20px;font-size:13px;font-weight:500;z-index:600;transition:transform .3s;white-space:nowrap;box-shadow:var(--shadow-lg)}
#toast.show{transform:translateX(-50%) translateY(0)}
.particle{position:absolute;pointer-events:none;border-radius:50%;animation:particleFloat 3s ease-out forwards}
@keyframes particleFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100px) scale(0)}}
.inv-section{margin-bottom:20px}
.inv-section h3{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--forest)}
.screen::-webkit-scrollbar{width:4px}
.screen::-webkit-scrollbar-thumb{background:var(--wood-light);border-radius:2px}
.prog-bar{height:6px;background:var(--cream-dark);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:3px;transition:width .5s}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <div class="tb-level" id="tb-level">Lv.1</div>
  <div class="tb-resources" id="tb-resources"></div>
  <button class="tb-btn" onclick="navTo('profile')">&#9881;</button>
</div>
<div class="screens">
  <div class="screen active" id="screen-home"><div class="scr-pad" id="home-content"></div></div>
  <div class="screen" id="screen-scan"><div class="scr-pad" id="scan-content"></div></div>
  <div class="screen" id="screen-cardbook"><div class="scr-pad" id="cardbook-content"></div></div>

function $(id){ return document.getElementById(id); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function gradeColor(g){ return GRADE_COLORS[g]||'#999'; }
function gradeName(g){ return GRADE_NAMES[g]||g; }

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function addXP(amount){
  GS.xp += amount;
  while(GS.xp >= GS.xpMax){ GS.xp -= GS.xpMax; GS.level++; GS.xpMax = Math.floor(GS.xpMax * 1.3);
    toast('레벨 업! Lv.' + GS.level);
    // Unlock rooms
    GS.rooms.forEach((r,i) => { if(ROOMS[i].unlock <= GS.level) r.unlocked = true; });
  }
  saveGame(); updateTopBar();
}

function addResource(id, amt){
  const r = RESOURCES.find(x=>x.id===id);
  if(r){ GS.resources[id] = Math.min((GS.resources[id]||0)+amt, r.max); saveGame(); updateTopBar(); }
}

function checkAchievement(id){
  if(!GS.achievements.includes(id)){ GS.achievements.push(id); const a=ACHIEVEMENTS.find(x=>x.id===id);
    if(a) toast('업적 달성: '+a.name+'!'); saveGame();
  }
}

const NAV_SCREENS = ['home','scan','cardbook','cabin','worldmap'];
const ALL_SCREENS = ['home','scan','cardbook','cabin','worldmap','inventory','profile'];

function navTo(id){
  if(id === currentScreen) return;
  const prev = $('screen-'+currentScreen);
  const next = $('screen-'+id);
  if(!next) return;
  prev.classList.remove('active');
  next.classList.add('active');
  // Update nav
  document.querySelectorAll('.nav-item').forEach(n => {
    const s = n.dataset.screen;
    n.classList.toggle('active', s===id || (s==='worldmap' && id==='inventory') || (s==='home' && id==='profile'));
  });
  currentScreen = id;
  renderScreen(id);
}

function renderScreen(id){
  switch(id){
    case 'home': renderHome(); break;
    case 'scan': renderScan(); break;
    case 'cardbook': renderCardBook(); break;
    case 'cabin': renderCabin(); break;
    case 'worldmap': renderWorldMap(); break;
    case 'inventory': renderInventory(); break;
    case 'profile': renderProfile(); break;
  }
}

// ===== RESOURCE PRODUCTION =====
function tickResources(){
  const now = Date.now();
  const elapsed = (now - GS.lastResourceTick) / 60000; // minutes
  GS.rooms.forEach((room, i) => {
    if(!room.unlocked) return;
    const def = ROOMS[i];
    const prod = def.prodRate * room.level * (1 + room.creatures.length * 0.2);
    const amount = Math.floor(elapsed * prod / 60); // per hour rate
    if(amount > 0 && GS.resources[def.resource] !== undefined){
      addResource(def.resource, amount);
    }
  });
  GS.lastResourceTick = now;
  saveGame();
}

// ===== BARCODE GENERATION =====
async function handleScan(){
  const barcode = ($('barcode-input')||{}).value||'';
  if(barcode.length < 8){ toast('8자리 이상 바코드를 입력하세요'); return; }

  const countryPrefix = barcode.substring(0,3);
  const mfgCode = barcode.substring(3,7);
  const prodCode = barcode.substring(7,12);
  const checkDigit = barcode.length >= 13 ? parseInt(barcode[12]) : 0;

  // Deterministic seed
  const seed = await sha256(barcode + '|forest_haven|2026');
  const seedInt = (s,o,l) => parseInt(seed.substring(o,o+l),16);

  // Rarity scoring
  let rarityScore = seedInt(0,4) % 1000;
  if(checkDigit === 7) rarityScore += 100;
  if(barcode === barcode.split('').reverse().join('')) rarityScore += 150;
  const uniqueDigits = new Set(barcode.split('')).size;
  if(uniqueDigits <= 4) rarityScore += 100;

  let grade;
  if(rarityScore >= 950) grade = 'mythic';
  else if(rarityScore >= 850) grade = 'legendary';
  else if(rarityScore >= 700) grade = 'epic';
  else if(rarityScore >= 500) grade = 'rare';
  else if(rarityScore >= 300) grade = 'uncommon';
  else grade = 'common';

  // Pick creature from DB based on grade
  const gradeCreatures = CREATURES_DB.filter(c => c.grade === grade);
  const picked = gradeCreatures.length > 0
    ? gradeCreatures[seedInt(4,4) % gradeCreatures.length]
    : CREATURES_DB[seedInt(4,4) % CREATURES_DB.length];

  // Generate stats from seed
  const hp = picked.hp + seedInt(8,3) % 30;
  const atk = picked.atk + seedInt(11,3) % 15;
  const def = picked.def + seedInt(14,3) % 15;

  // Country bonus
  const cc = COUNTRY_CODES[countryPrefix] || {region:'Unknown',biome:'forest',bonus:'wood'};

  const card = {
    id: 'card_' + Date.now(),
    creatureId: picked.id,
    name: picked.name,
    grade: grade,
    type: 'creature',
    hp, atk, def,
    element: picked.element,
    lore: picked.lore,
    img: picked.img,
    barcode: barcode,
    origin: cc.region,
    timestamp: Date.now()
  };

  GS.cards.push(card);
  GS.scanHistory.push({barcode,name:card.name,grade:card.grade,creatureId:card.id,time:Date.now()});
  GS.stats.totalScans++;
  GS.stats.totalCards++;
  addXP(grade==='mythic'?100:grade==='legendary'?50:grade==='epic'?30:grade==='rare'?20:grade==='uncommon'?12:8);

  // Bonus resource from country
  if(cc.bonus) addResource(cc.bonus, grade==='legendary'?5:grade==='epic'?3:2);

  checkAchievement('first_scan');
  if(GS.cards.length >= 10) checkAchievement('collect_10');
  if(['rare','epic','legendary','mythic'].includes(grade)) checkAchievement('rare_find');
  if(grade === 'legendary') checkAchievement('legendary');
  if(grade === 'mythic') checkAchievement('mythic');

  saveGame();

// ===== CABIN CANVAS =====
function drawCabin(){
  const canvas = $('cabin-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Sky
  const sky = ctx.createLinearGradient(0,0,0,H*0.35);
  sky.addColorStop(0,'#87CEEB'); sky.addColorStop(1,'#b8e4f0');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H*0.35);

  // Sun
  ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(60,40,20,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,215,0,0.2)'; ctx.beginPath(); ctx.arc(60,40,35,0,Math.PI*2); ctx.fill();

  // Clouds
  drawCloud(ctx,250,30,40); drawCloud(ctx,350,50,30);

  // Hills
  ctx.fillStyle = '#4a8c3f';
  ctx.beginPath(); ctx.moveTo(0,H*0.35); ctx.quadraticCurveTo(100,H*0.2,200,H*0.35); ctx.quadraticCurveTo(300,H*0.22,W,H*0.35); ctx.lineTo(W,H*0.4); ctx.lineTo(0,H*0.4); ctx.fill();

  // Ground
  ctx.fillStyle = '#6B8E23'; ctx.fillRect(0,H*0.35,W,H*0.08);
  ctx.fillStyle = '#8B7355'; ctx.fillRect(0,H*0.43,W,H*0.57);

  // Cabin structure
  const cx = 60, cy = H*0.2, cw = W-120, ch = H*0.65;

  // Basement (B1)
  ctx.fillStyle = '#4a3728'; ctx.fillRect(cx,cy+ch*0.75,cw,ch*0.25);
  ctx.strokeStyle = '#3a2a1c'; ctx.lineWidth = 1;
  drawRoomBox(ctx,cx+5,cy+ch*0.77,cw/2-10,ch*0.21,'♨️','온천',GS.rooms.find(r=>r.id==='hotspring'));
  drawRoomBox(ctx,cx+cw/2+5,cy+ch*0.77,cw/2-10,ch*0.21,'💎','수정동굴',GS.rooms.find(r=>r.id==='crystal_cave'));

  // 1F
  ctx.fillStyle = '#8B6914'; ctx.fillRect(cx,cy+ch*0.5,cw,ch*0.25);
  ctx.strokeStyle = '#705510'; ctx.strokeRect(cx,cy+ch*0.5,cw,ch*0.25);
  const w1 = cw/4;
  drawRoomBox(ctx,cx+2,cy+ch*0.52,w1-4,ch*0.21,'🏠','거실',GS.rooms.find(r=>r.id==='living'));
  drawRoomBox(ctx,cx+w1+2,cy+ch*0.52,w1-4,ch*0.21,'🍳','부엌',GS.rooms.find(r=>r.id==='kitchen'));
  drawRoomBox(ctx,cx+w1*2+2,cy+ch*0.52,w1-4,ch*0.21,'🌿','약초원',GS.rooms.find(r=>r.id==='herb_garden'));
  drawRoomBox(ctx,cx+w1*3+2,cy+ch*0.52,w1-4,ch*0.21,'🐝','양봉장',GS.rooms.find(r=>r.id==='apiary'));

  // 2F
  ctx.fillStyle = '#9B7924'; ctx.fillRect(cx+20,cy+ch*0.28,cw-40,ch*0.22);
  ctx.strokeStyle = '#806515'; ctx.strokeRect(cx+20,cy+ch*0.28,cw-40,ch*0.22);
  const w2 = (cw-40)/2;
  drawRoomBox(ctx,cx+22,cy+ch*0.30,w2-4,ch*0.18,'🔨','공방',GS.rooms.find(r=>r.id==='workshop'));
  drawRoomBox(ctx,cx+22+w2,cy+ch*0.30,w2-4,ch*0.18,'📚','서재',GS.rooms.find(r=>r.id==='library'));

  // 3F + Roof
  ctx.fillStyle = '#AB8934'; ctx.fillRect(cx+50,cy+ch*0.1,cw-100,ch*0.18);
  drawRoomBox(ctx,cx+52,cy+ch*0.12,((cw-100)/2)-4,ch*0.14,'🔭','전망대',GS.rooms.find(r=>r.id==='observatory'));
  drawRoomBox(ctx,cx+52+(cw-100)/2,cy+ch*0.12,((cw-100)/2)-4,ch*0.14,'🌳','나무집',GS.rooms.find(r=>r.id==='treehouse'));

  // Roof
  ctx.fillStyle = '#8B4513';
  ctx.beginPath();
  ctx.moveTo(cx+30,cy+ch*0.1);
  ctx.lineTo(W/2,cy-10);
  ctx.lineTo(cx+cw-30,cy+ch*0.1);
  ctx.fill();

  // Trees
  drawTree(ctx,20,H*0.35); drawTree(ctx,W-40,H*0.35);

  // Chimney smoke
  for(let i=0;i<3;i++){
    ctx.fillStyle = `rgba(200,200,200,${0.3-i*0.08})`;
    ctx.beginPath();
    ctx.arc(W/2+10, cy-20-i*15+Math.sin(Date.now()/500+i)*3, 5+i*3, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawRoomBox(ctx,x,y,w,h,icon,name,state){
  const unlocked = state && state.unlocked;
  ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.2)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = unlocked ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.3)';
  ctx.strokeRect(x,y,w,h);
  ctx.font = Math.min(h*0.5,20)+'px serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = unlocked ? '#fff' : '#666';
  ctx.fillText(icon, x+w/2, y+h*0.5);
  ctx.font = '9px sans-serif';
  ctx.fillText(unlocked?name:'🔒', x+w/2, y+h*0.8);
}

function drawCloud(ctx,x,y,r){
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x-r*0.6,y+r*0.2,r*0.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.6,y+r*0.2,r*0.7,0,Math.PI*2); ctx.fill();
}

function drawTree(ctx,x,y){
  ctx.fillStyle = '#5c3d2e'; ctx.fillRect(x-3,y-30,6,30);
  ctx.fillStyle = '#2d5a27';
  ctx.beginPath(); ctx.moveTo(x-18,y-25); ctx.lineTo(x,y-55); ctx.lineTo(x+18,y-25); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-14,y-38); ctx.lineTo(x,y-62); ctx.lineTo(x+14,y-38); ctx.fill();
}

function closeRoomDetail(){ $('room-detail').classList.remove('show'); }

function upgradeRoom(roomId){
  const state = GS.rooms.find(r=>r.id===roomId);
  if(!state) return;
  const woodCost = state.level * 5;
  const stoneCost = state.level * 3;
  if(GS.resources.wood >= woodCost && GS.resources.stone >= stoneCost){
    GS.resources.wood -= woodCost;
    GS.resources.stone -= stoneCost;
    state.level++;
    saveGame(); updateTopBar();
    toast(ROOMS.find(r=>r.id===roomId).name + ' Lv.' + state.level + ' 업그레이드!');
    showRoomDetail(roomId);
  } else {
    toast('자원이 부족합니다');
  }
}

function showAssignCreature(roomId, slotIdx){
  const available = GS.cards.filter(c => c.type==='creature' && !GS.rooms.some(r=>r.creatures.includes(c.id)));
  if(available.length === 0){ toast('배치 가능한 생명체가 없습니다'); return; }
  const card = available[0]; // Auto-assign first available
  const state = GS.rooms.find(r=>r.id===roomId);
  state.creatures[slotIdx] = card.id;
  saveGame();
  toast(card.name + ' 배치 완료!');
  showRoomDetail(roomId);
}

function removeFromRoom(roomId, idx){
  const state = GS.rooms.find(r=>r.id===roomId);
  const card = GS.cards.find(c=>c.id===state.creatures[idx]);
  state.creatures.splice(idx,1);
  saveGame();
  toast((card?card.name:'생명체')+' 해제');
  showRoomDetail(roomId);
}

async function exploreRegion(landmarkId){
  if(GS.resources.herb < 2){ toast('약초가 부족합니다 (2개 필요)'); return; }
  GS.resources.herb -= 2;

  const lm = LANDMARKS.find(l=>l.id===landmarkId);
  if(!lm) return;

  if(!GS.visitedLandmarks.includes(landmarkId)){
    GS.visitedLandmarks.push(landmarkId);
    if(GS.visitedLandmarks.length >= 3) checkAchievement('explore_3');
  }
  GS.stats.totalExplores++;

  // Generate a creature from this region
  const seed = await sha256(landmarkId + '|' + Date.now());
  const seedInt = parseInt(seed.substring(0,8),16);

  // Pick from region creatures with grade boost
  const regionCreatures = lm.creatures.map(cid => CREATURES_DB.find(c=>c.id===cid)).filter(Boolean);
  const picked = regionCreatures[seedInt % regionCreatures.length] || CREATURES_DB[seedInt % CREATURES_DB.length];

  const card = {
    id: 'card_' + Date.now(),
    creatureId: picked.id,
    name: picked.name,
    grade: picked.grade,
    type: 'creature',
    hp: picked.hp + (seedInt % 20),
    atk: picked.atk + (seedInt % 10),
    def: picked.def + (seedInt % 10),
    element: picked.element,
    lore: picked.lore,
    img: picked.img,
    barcode: 'explore',
    origin: lm.country,
    timestamp: Date.now()
  };

  GS.cards.push(card);
  GS.stats.totalCards++;
  addXP(25);

  // Bonus resources from exploration
  addResource('wood', 3);
  addResource('stone', 2);

  saveGame();
  closeRegion();
  showCardDiscover(card);
}

// ===== INVENTORY & CRAFTING =====
function renderInventory(){
  $('inventory-content').innerHTML = `
    <div class="scr-title">인벤토리 & 크래프팅</div>
    <div class="inv-section">
      <h3>자원</h3>
      <div class="resource-grid">
        ${RESOURCES.map(r => `
          <div class="res-card">
            <div class="res-icon">${r.icon}</div>
            <div class="res-name">${r.name}</div>
            <div class="res-amount">${GS.resources[r.id]||0}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="inv-section">
      <h3>크래프팅</h3>
      ${RECIPES.map(recipe => {
        const canCraft = Object.entries(recipe.mats).every(([res,amt]) => (GS.resources[res]||0) >= amt);
        const matStr = Object.entries(recipe.mats).map(([res,amt]) => {
          const r = RESOURCES.find(x=>x.id===res);
          const have = GS.resources[res]||0;
          return `<span style="color:${have>=amt?'var(--success)':'var(--danger)'};">${r?r.icon:res}${amt}</span>`;
        }).join(' + ');
        return `<div class="recipe-card">
          <div class="recipe-icon">${recipe.icon}</div>
          <div class="recipe-info">
            <div class="recipe-name">${recipe.name}</div>
            <div class="recipe-mats">${matStr}</div>
          </div>
          <button class="recipe-craft" ${canCraft?'':'disabled'} onclick="craftItem('${recipe.id}')">제작</button>
        </div>`;
      }).join('')}
    </div>
    <div class="inv-section">
      <h3>보유 아이템 (${GS.items.length})</h3>
      ${GS.items.length === 0 ? '<div class="empty-state"><p>아직 아이템이 없습니다</p></div>' :
        GS.items.map(item => `<div class="recipe-card">
          <div class="recipe-icon">${item.icon||'📦'}</div>
          <div class="recipe-info">
            <div class="recipe-name">${item.name}</div>
            <div class="recipe-mats">x${item.qty||1}</div>
          </div>
        </div>`).join('')}
    </div>`;
}

function craftItem(recipeId){
  const recipe = RECIPES.find(r=>r.id===recipeId);
  if(!recipe) return;
  const canCraft = Object.entries(recipe.mats).every(([res,amt]) => (GS.resources[res]||0) >= amt);
  if(!canCraft){ toast('자원이 부족합니다'); return; }

  // Consume resources
  Object.entries(recipe.mats).forEach(([res,amt]) => { GS.resources[res] -= amt; });

  // Add item
  const existing = GS.items.find(i=>i.id===recipeId);
  if(existing){ existing.qty = (existing.qty||1) + 1; }
  else { GS.items.push({id:recipeId, name:recipe.name, icon:recipe.icon, qty:1}); }

  GS.stats.totalCrafts++;
  checkAchievement('craft_first');
  addXP(15);
  saveGame(); updateTopBar();
  toast(recipe.name + ' 제작 완료!');
  renderInventory();
}

      <div class="prog-bar" style="margin-top:8px;background:rgba(255,255,255,.2)">

      </div>
      <div class="profile-stats">
        <div class="ps-item"><div class="ps-val">${GS.stats.totalScans}</div><div class="ps-label">총 스캔</div></div>

      <div class="settings-item"><span class="si-label">해금된 방</span><span class="si-value">${unlockedRooms}/${ROOMS.length}</span></div>
      <div class="settings-item"><span class="si-label">보유 아이템</span><span class="si-value">${GS.items.length}종</span></div>
    </div>

    <div style="font-size:15px;font-weight:700;margin-bottom:10px">업적</div>
    <div class="achieve-grid">

        const done = GS.achievements.includes(a.id);

          <div class="achieve-icon">${a.icon}</div>

      }).join('')}
    </div>

    <div style="font-size:15px;font-weight:700;margin:16px 0 10px">설정</div>
    <div class="settings-group">
      <div class="settings-item">
        <span class="si-label">효과음</span>

      </div>
      <div class="settings-item">
        <span class="si-label">알림</span>
        <button class="si-toggle ${GS.settings.notifications?'on':''}" onclick="toggleSetting('notifications',this)"></button>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-item" style="cursor:pointer" onclick="if(confirm('정말 초기화하시겠습니까?')){localStorage.removeItem('forest_haven_save');location.reload()}">
        <span class="si-label" style="color:var(--danger)">데이터 초기화</span>
        <span class="si-value">⚠️</span>
      </div>
    </div>
    <div style="text-align:center;padding:20px;color:var(--text-light);font-size:11px">
      Forest Haven v1.0<br>숲의 안식처 | biz_life project #8
    </div>`;
}

function toggleSetting(key, btn){
  GS.settings[key] = !GS.settings[key];
  btn.classList.toggle('on');
  saveGame();
}

// ===== INITIALIZATION =====
function init(){
  tickResources();
  updateTopBar();
  renderHome();

  // Periodic resource tick
  setInterval(() => { tickResources(); updateTopBar(); }, 60000);

  // Add starter cards if new game
  if(GS.cards.length === 0 && GS.stats.totalScans === 0){
    const starter = CREATURES_DB.find(c=>c.id==='forest_deer');
    if(starter){
      GS.cards.push({
        id:'card_starter',creatureId:starter.id,name:starter.name,grade:starter.grade,
        type:'creature',hp:starter.hp,atk:starter.atk,def:starter.def,
        element:starter.element,lore:starter.lore,img:starter.img,
        barcode:'starter',origin:'Forest Haven',timestamp:Date.now()
      });
      GS.stats.totalCards = 1;
      saveGame();
    }
  }

  // Keyboard shortcut for barcode input
  document.addEventListener('keydown', e => {
    if(e.key === 'Enter' && currentScreen === 'scan'){
      handleScan();
    }
  });
}

init();
</script>
