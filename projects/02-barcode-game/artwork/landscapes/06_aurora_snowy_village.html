<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Aurora Snowy Village - BarcodeQuest Landscape</title>
<style>
    body { margin: 0; background: #050510; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    canvas { border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .info { position: fixed; bottom: 20px; color: #aaa; font-family: sans-serif; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div class="info">Aurora Snowy Village (1280x720) - 우클릭 → 이미지 저장 가능</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let seed = 5678;
function rng() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a, b) { return a + rng() * (b - a); }
function lerpC(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgba(c, a) { return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }

function brush(x, y, w, h, c, a, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang || 0);
    ctx.fillStyle = rgba(c, a);
    ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}
function oilBrush(x, y, w, h, c, a, ang) {
    for (let i = 0; i < 3; i++) {
        brush(x+rr(-2,2), y+rr(-1,1), w*rr(0.8,1.2), h*rr(0.7,1.1),
            [c[0]+rr(-10,10), c[1]+rr(-8,8), c[2]+rr(-8,8)], a*rr(0.5,1), (ang||0)+rr(-0.08,0.08));
    }
}

// ─── NIGHT SKY ───
function paintSky() {
    const colors = [
        [5, 8, 25],    // deep space
        [10, 15, 40],  // dark navy
        [15, 25, 55],  // navy
        [20, 35, 65],  // blue-navy (horizon)
    ];
    for (let y = 0; y < H * 0.5; y++) {
        const t = y / (H * 0.5);
        const seg = t * (colors.length - 1);
        const i = Math.min(Math.floor(seg), colors.length - 2);
        const c = lerpC(colors[i], colors[i+1], seg - i);
        for (let x = 0; x < W; x += rr(10, 22)) {
            oilBrush(x, y, rr(20, 50), rr(6, 14), c, rr(0.5, 0.85), rr(-0.03, 0.03));
        }
    }
}

// ─── STARS ───
function paintStars() {
    for (let i = 0; i < 200; i++) {
        const x = rr(0, W);
        const y = rr(0, H * 0.4);
        const size = rr(0.5, 2.5);
        const brightness = rr(0.3, 0.9);
        ctx.fillStyle = rgba([255, 255, rr(220, 255)], brightness);
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();

        // Star glow
        if (size > 1.5) {
            ctx.fillStyle = rgba([200, 220, 255], 0.1);
            ctx.beginPath();
            ctx.arc(x, y, size * 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// ─── AURORA BOREALIS ───
function paintAurora() {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    const auroraColors = [
        [0, 255, 100],   // green
        [0, 200, 150],   // teal
        [50, 255, 120],  // bright green
        [100, 200, 255], // cyan
        [150, 100, 255], // purple
    ];

    // Multiple curtains
    for (let curtain = 0; curtain < 5; curtain++) {
        const baseX = rr(W * 0.1, W * 0.9);
        const baseY = rr(H * 0.05, H * 0.15);
        const color = auroraColors[curtain % auroraColors.length];

        for (let i = 0; i < 150; i++) {
            const t = i / 150;
            const x = baseX + Math.sin(t * 6 + curtain) * (100 + curtain * 30);
            const y = baseY + t * H * 0.35;
            const width = (20 + Math.sin(t * 4) * 15) * (1 - t * 0.5);
            const alpha = (0.03 + Math.sin(t * 3) * 0.02) * (1 - t * 0.8);

            const c = lerpC(color, [0, 100, 50], t * 0.5);
            brush(x, y, width, rr(8, 20), c, alpha, rr(-0.1, 0.1));
        }
    }

    // Extra bright bands
    for (let i = 0; i < 80; i++) {
        const x = rr(W * 0.15, W * 0.85);
        const y = rr(H * 0.08, H * 0.3);
        const c = auroraColors[Math.floor(rr(0, auroraColors.length))];
        brush(x, y, rr(30, 80), rr(4, 12), c, rr(0.01, 0.04), rr(-0.3, 0.3));
    }

    ctx.restore();
}

// ─── MOUNTAINS ───
function paintMountains() {
    const mtSets = [
        { peaks: [[0,0.42],[200,0.32],[450,0.28],[700,0.35],[1000,0.3],[1280,0.38]], color: [15, 25, 45], haze: 0.3 },
        { peaks: [[0,0.48],[300,0.38],[550,0.42],[800,0.36],[1050,0.4],[1280,0.45]], color: [20, 30, 50], haze: 0.2 },
    ];

    for (const mt of mtSets) {
        for (let x = 0; x < W; x += rr(2, 5)) {
            let y = H * 0.5;
            for (let p = 0; p < mt.peaks.length - 1; p++) {
                const [px1, ph1] = mt.peaks[p];
                const [px2, ph2] = mt.peaks[p + 1];
                if (x >= px1 && x <= px2) {
                    const t = (x - px1) / (px2 - px1);
                    const smooth = t * t * (3 - 2 * t);
                    y = H * (ph1 + (ph2 - ph1) * smooth) + Math.sin(x * 0.02) * 5;
                    break;
                }
            }

            for (let py = y; py < H * 0.55; py += rr(3, 7)) {
                let c = [...mt.color];
                // Snow
                if (py < y + 15) c = lerpC(c, [180, 190, 210], Math.max(0, 1 - (py - y) / 15));
                // Aurora reflection
                const auroraT = Math.sin(x * 0.005) * 0.5 + 0.5;
                c = lerpC(c, [0, 60, 40], auroraT * 0.1);

                oilBrush(x, py, rr(5, 12), rr(4, 10), c, rr(0.4, 0.7), rr(-0.15, 0.15));
            }
        }
    }
}

// ─── SNOW FIELD ───
function paintSnowField() {
    for (let y = H * 0.5; y < H; y += rr(1, 3)) {
        const depth = (y - H * 0.5) / (H * 0.5);
        for (let x = 0; x < W; x += rr(4, 10)) {
            const baseC = [170 + depth * 30, 180 + depth * 25, 200 + depth * 20];
            // Aurora reflection on snow
            const auroraRef = Math.sin(x * 0.008 + y * 0.005) * 0.5 + 0.5;
            const c = lerpC(baseC, [100, 200, 140], auroraRef * 0.08 * (1 - depth));

            // Moonlight shadow
            const shadow = Math.sin(x * 0.01 + y * 0.02) > 0.3 ? 1 : 0.85;
            const fc = [c[0] * shadow, c[1] * shadow, c[2] * shadow];

            oilBrush(x, y, rr(10, 22), rr(4, 8), fc, rr(0.5, 0.8), rr(-0.03, 0.03));
        }
    }
}

// ─── VILLAGE HOUSES ───
function paintHouse(hx, hy, scale, roofColor) {
    const w = 35 * scale, h = 25 * scale;

    // Walls
    for (let i = 0; i < 30; i++) {
        const c = [rr(160, 185), rr(150, 170), rr(130, 150)];
        oilBrush(hx + rr(-w/2, w/2), hy - rr(0, h),
            rr(6, 12) * scale, rr(4, 8) * scale, c, rr(0.5, 0.8), rr(-0.1, 0.1));
    }

    // Roof
    for (let i = 0; i < 40; i++) {
        const rx = rr(-w * 0.7, w * 0.7);
        const roofH = (1 - Math.abs(rx) / (w * 0.7)) * h * 0.6;
        const c = roofColor || [rr(100, 130), rr(40, 60), rr(30, 50)];
        oilBrush(hx + rx, hy - h - roofH * rr(0.2, 1),
            rr(6, 14) * scale, rr(4, 8) * scale, c, rr(0.5, 0.8), rr(-0.2, 0.2));
    }

    // Snow on roof
    for (let i = 0; i < 20; i++) {
        const rx = rr(-w * 0.6, w * 0.6);
        const roofH = (1 - Math.abs(rx) / (w * 0.7)) * h * 0.6;
        brush(hx + rx, hy - h - roofH + rr(-2, 2),
            rr(5, 12) * scale, rr(3, 6) * scale,
            [rr(220, 240), rr(225, 245), rr(235, 255)], rr(0.3, 0.6), rr(-0.1, 0.1));
    }

    // Window (warm glow)
    const wx = hx, wy = hy - h * 0.5;
    for (let r = 15; r > 0; r -= 2) {
        const t = 1 - r / 15;
        const c = lerpC([255, 200, 80], [255, 240, 180], t);
        ctx.fillStyle = rgba(c, 0.02 + t * 0.08);
        ctx.beginPath(); ctx.arc(wx, wy, r * scale, 0, Math.PI * 2); ctx.fill();
    }
    // Window pane
    brush(wx, wy, 6 * scale, 6 * scale, [255, 220, 120], 0.6, 0);

    // Chimney smoke
    for (let i = 0; i < 15; i++) {
        const t = i / 15;
        const sx = hx + w * 0.3 + Math.sin(t * 5) * (5 + t * 15);
        const sy = hy - h - h * 0.5 - t * 40;
        brush(sx, sy, rr(5, 12) * (1 + t), rr(4, 10) * (1 + t),
            [180, 185, 200], rr(0.02, 0.06) * (1 - t), rr(-0.1, 0.1));
    }
}

// ─── PINE TREES (Snow) ───
function paintSnowyPine(px, py, scale) {
    // Trunk
    for (let i = 0; i < 6; i++) {
        brush(px + rr(-1, 1), py - rr(0, 40) * scale,
            rr(2, 4) * scale, rr(8, 15),
            [rr(30, 50), rr(25, 35), rr(20, 30)], rr(0.5, 0.8), rr(-0.05, 0.05));
    }
    // Pine layers with snow
    for (let layer = 0; layer < 6; layer++) {
        const ly = py - (15 + layer * 10) * scale;
        const width = (22 - layer * 3) * scale;
        for (let i = 0; i < 10; i++) {
            // Green
            oilBrush(px + rr(-width, width), ly + rr(-3, 3),
                rr(6, 14) * scale, rr(4, 8) * scale,
                [rr(15, 35), rr(40, 65), rr(25, 40)], rr(0.4, 0.7), rr(-0.3, 0.3));
        }
        // Snow on branches
        for (let i = 0; i < 5; i++) {
            brush(px + rr(-width * 0.8, width * 0.8), ly - rr(0, 4),
                rr(5, 12) * scale, rr(3, 5) * scale,
                [rr(210, 235), rr(220, 240), rr(235, 255)], rr(0.2, 0.5), rr(-0.1, 0.1));
        }
    }
}

// ─── FALLING SNOW ───
function paintSnow() {
    for (let i = 0; i < 300; i++) {
        const x = rr(0, W);
        const y = rr(0, H);
        const size = rr(1, 3.5);
        const alpha = rr(0.2, 0.7);
        ctx.fillStyle = rgba([255, 255, 255], alpha);
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ─── FROZEN LAKE ───
function paintFrozenLake() {
    const lakeLeft = W * 0.15, lakeRight = W * 0.55;
    const lakeTop = H * 0.65, lakeBot = H * 0.85;

    for (let y = lakeTop; y < lakeBot; y += rr(2, 4)) {
        for (let x = lakeLeft; x < lakeRight; x += rr(5, 12)) {
            // Elliptical boundary
            const cx = (lakeLeft + lakeRight) / 2;
            const cy = (lakeTop + lakeBot) / 2;
            const dx = (x - cx) / ((lakeRight - lakeLeft) / 2);
            const dy = (y - cy) / ((lakeBot - lakeTop) / 2);
            if (dx * dx + dy * dy > 1) continue;

            // Ice colors with aurora reflection
            const auroraRef = Math.sin(x * 0.01 + y * 0.008) * 0.5 + 0.5;
            let c = lerpC([120, 140, 170], [160, 180, 200], rng());
            c = lerpC(c, [60, 180, 120], auroraRef * 0.15);

            oilBrush(x, y, rr(10, 22), rr(3, 6), c, rr(0.3, 0.6), rr(-0.02, 0.02));
        }
    }
}

// ─── RENDER ───
ctx.fillStyle = '#050510';
ctx.fillRect(0, 0, W, H);

paintSky();
paintStars();
paintAurora();
paintMountains();
paintSnowField();
paintFrozenLake();

// Village
paintHouse(W * 0.65, H * 0.62, 1.0, [130, 50, 40]);
paintHouse(W * 0.78, H * 0.64, 0.8, [80, 80, 120]);
paintHouse(W * 0.72, H * 0.68, 1.1, [100, 60, 45]);
paintHouse(W * 0.88, H * 0.67, 0.7, [90, 70, 100]);

// Trees
paintSnowyPine(W * 0.02, H * 0.62, 1.3);
paintSnowyPine(W * 0.08, H * 0.6, 1.0);
paintSnowyPine(W * 0.14, H * 0.63, 1.4);
paintSnowyPine(W * 0.95, H * 0.61, 1.2);
paintSnowyPine(W * 0.55, H * 0.58, 0.7);
paintSnowyPine(W * 0.42, H * 0.59, 0.5);
paintSnowyPine(W * 0.6, H * 0.66, 1.0);

paintSnow();

// Cold blue overlay
ctx.fillStyle = 'rgba(80, 100, 180, 0.03)';
ctx.fillRect(0, 0, W, H);

// Vignette
const vg = ctx.createRadialGradient(W/2, H*0.4, W*0.2, W/2, H/2, W*0.75);
vg.addColorStop(0, 'rgba(0,0,0,0)');
vg.addColorStop(1, 'rgba(0,0,15,0.4)');
ctx.fillStyle = vg;
ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
