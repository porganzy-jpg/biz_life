<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="adventureSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#81D4FA"/>
    </linearGradient>
    <linearGradient id="mapPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <linearGradient id="goldCompass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="#E8F5E9"/>

  <text x="400" y="40" text-anchor="middle" font-size="11" fill="#2E7D32" letter-spacing="4">TYPE 08</text>
  <text x="400" y="72" text-anchor="middle" font-size="28" font-weight="bold" fill="#1B5E20">EXPLORER / ADVENTURE</text>
  <text x="400" y="95" text-anchor="middle" font-size="13" fill="#4CAF50">"뒷산이 에베레스트였고, 개울이 아마존이었던 시절"</text>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="#66BB6A">보물지도 그리고 탐험대 놀이하던 아이. 세상은 아직 미지로 가득했다.</text>

  <line x1="100" y1="130" x2="700" y2="130" stroke="#C8E6C9" stroke-width="1"/>

  <!-- Stage 1: Lost Explorer -->
  <text x="200" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#81C784">Stage 1: Lost</text>
  <text x="200" y="182" text-anchor="middle" font-size="10" fill="#A5D6A7">"...지도가... 젖어서 안 보여..."</text>

  <g transform="translate(200, 345)">
    <ellipse cx="0" cy="82" rx="42" ry="8" fill="#4CAF50" opacity="0.1"/>

    <!-- Small, tired explorer creature -->
    <!-- Body (round, compact, mud-stained) -->
    <ellipse cx="0" cy="10" rx="25" ry="28" fill="#A5D6A7" stroke="#66BB6A" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="0" cy="10" rx="20" ry="22" fill="#C8E6C9" opacity="0.6"/>

    <!-- Head -->
    <circle cx="0" cy="-25" r="22" fill="#C8E6C9" stroke="#81C784" stroke-width="1.5" opacity="0.8"/>

    <!-- Explorer hat (beaten up) -->
    <ellipse cx="0" cy="-38" rx="25" ry="6" fill="#8D6E63" opacity="0.5"/>
    <path d="M-18,-38 Q0,-52 18,-38" fill="#A1887F" opacity="0.5" stroke="#8D6E63" stroke-width="1"/>
    <!-- Hat dent -->
    <path d="M5,-48 Q8,-45 6,-43" fill="none" stroke="#795548" stroke-width="0.8" opacity="0.4"/>

    <!-- Tired eyes -->
    <line x1="-10" y1="-25" x2="-4" y2="-25" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="4" y1="-25" x2="10" y2="-25" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="-7" cy="-23" r="1.5" fill="#2E7D32" opacity="0.3"/>
    <circle cx="7" cy="-23" r="1.5" fill="#2E7D32" opacity="0.3"/>

    <!-- Tired mouth -->
    <path d="M-4,-16 Q0,-18 4,-16" fill="none" stroke="#2E7D32" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

    <!-- Torn map in hand -->
    <rect x="20" y="-5" width="18" height="14" rx="2" fill="#FFECB3" opacity="0.4" stroke="#D7CCC8" stroke-width="0.8" transform="rotate(15,29,2)"/>
    <line x1="23" y1="0" x2="33" y2="-2" stroke="#BCAAA4" stroke-width="0.5" opacity="0.3"/>
    <!-- Tear in map -->
    <path d="M30,-2 L32,5" fill="none" stroke="#D7CCC8" stroke-width="0.8" opacity="0.5"/>

    <!-- Little legs (sitting tired) -->
    <ellipse cx="-10" cy="38" rx="8" ry="6" fill="#81C784" opacity="0.5"/>
    <ellipse cx="10" cy="38" rx="8" ry="6" fill="#81C784" opacity="0.5"/>
    <!-- Worn boots -->
    <ellipse cx="-12" cy="42" rx="6" ry="4" fill="#795548" opacity="0.4"/>
    <ellipse cx="12" cy="42" rx="6" ry="4" fill="#795548" opacity="0.4"/>

    <!-- Broken compass nearby -->
    <circle cx="-28" cy="30" r="6" fill="#D7CCC8" opacity="0.3" stroke="#BCAAA4" stroke-width="0.8"/>
    <line x1="-28" y1="27" x2="-26" y2="32" stroke="#BCAAA4" stroke-width="0.8" opacity="0.4"/>

    <!-- Mud stains -->
    <circle cx="12" cy="5" r="5" fill="#8D6E63" opacity="0.1"/>
    <circle cx="-15" cy="20" r="4" fill="#8D6E63" opacity="0.08"/>
  </g>

  <!-- Stage 3: Master Explorer -->
  <text x="600" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">Stage 3: PATHFINDER</text>
  <text x="600" y="182" text-anchor="middle" font-size="10" fill="#4CAF50">"모든 길은 모험이야! 자, 출발이다!!"</text>

  <g transform="translate(600, 335)">
    <ellipse cx="0" cy="92" rx="55" ry="10" fill="#4CAF50" opacity="0.1"/>

    <!-- Adventure aura -->
    <circle cx="0" cy="5" r="80" fill="#FFD54F" opacity="0.03"/>
    <circle cx="0" cy="5" r="65" fill="#4CAF50" opacity="0.04"/>

    <!-- Body (confident, upright) -->
    <ellipse cx="0" cy="10" rx="28" ry="32" fill="#66BB6A" stroke="#2E7D32" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="22" ry="26" fill="#81C784"/>

    <!-- Belt with tools -->
    <rect x="-28" y="5" width="56" height="6" rx="3" fill="#8D6E63" stroke="#5D4037" stroke-width="1"/>
    <!-- Belt buckle -->
    <rect x="-5" y="3" width="10" height="10" rx="2" fill="#FFD54F" stroke="#FF8F00" stroke-width="1"/>
    <text x="0" y="12" text-anchor="middle" font-size="6" fill="#FF6F00" font-weight="bold">N</text>

    <!-- Utility pouches -->
    <rect x="-25" y="10" width="10" height="8" rx="2" fill="#A1887F" stroke="#8D6E63" stroke-width="0.8"/>
    <rect x="15" y="10" width="10" height="8" rx="2" fill="#A1887F" stroke="#8D6E63" stroke-width="0.8"/>

    <!-- Head -->
    <circle cx="0" cy="-28" r="25" fill="#A5D6A7" stroke="#66BB6A" stroke-width="2"/>

    <!-- Explorer hat (restored, proud) -->
    <ellipse cx="0" cy="-42" rx="28" ry="7" fill="#6D4C41" stroke="#5D4037" stroke-width="1.5"/>
    <path d="M-20,-42 Q0,-58 20,-42" fill="#8D6E63" stroke="#6D4C41" stroke-width="1.5"/>
    <!-- Hat band -->
    <path d="M-18,-42 Q0,-46 18,-42" fill="none" stroke="#FFD54F" stroke-width="2"/>
    <!-- Feather in hat -->
    <path d="M16,-45 Q22,-58 18,-60 Q14,-55 16,-45" fill="#FF8F00" opacity="0.7"/>

    <!-- Confident eyes (sparkling) -->
    <ellipse cx="-8" cy="-30" rx="5" ry="6" fill="#FFF"/>
    <ellipse cx="8" cy="-30" rx="5" ry="6" fill="#FFF"/>
    <circle cx="-8" cy="-29" r="3.5" fill="#1B5E20"/>
    <circle cx="8" cy="-29" r="3.5" fill="#1B5E20"/>
    <circle cx="-6" cy="-31" r="1.5" fill="#FFF"/>
    <circle cx="10" cy="-31" r="1.5" fill="#FFF"/>
    <!-- Determined eyebrows -->
    <line x1="-12" y1="-37" x2="-4" y2="-36" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="-36" x2="12" y2="-37" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>

    <!-- Big grin -->
    <path d="M-8,-20 Q0,-14 8,-20" fill="#FFF" stroke="#2E7D32" stroke-width="1.5"/>

    <!-- Blush -->
    <ellipse cx="-14" cy="-22" rx="5" ry="3" fill="#FF8A65" opacity="0.3"/>
    <ellipse cx="14" cy="-22" rx="5" ry="3" fill="#FF8A65" opacity="0.3"/>

    <!-- Scarf (flowing in wind) -->
    <path d="M-18,-12 Q0,-8 18,-12" fill="none" stroke="#F44336" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M18,-12 Q25,-8 30,-14 Q35,-18 32,-12 Q30,-8 35,-10" fill="none" stroke="#F44336" stroke-width="3" stroke-linecap="round"/>
    <path d="M35,-10 Q38,-8 36,-5" fill="none" stroke="#EF5350" stroke-width="2.5" stroke-linecap="round"/>

    <!-- One arm pointing forward -->
    <path d="M28,0 Q38,-5 45,-15" fill="none" stroke="#66BB6A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="45" cy="-15" r="5" fill="#81C784" stroke="#66BB6A" stroke-width="1.5"/>
    <!-- Pointing finger -->
    <line x1="48" y1="-18" x2="55" y2="-25" stroke="#81C784" stroke-width="3" stroke-linecap="round"/>

    <!-- Other arm holding map (glowing) -->
    <path d="M-28,0 Q-38,-5 -40,5" fill="none" stroke="#66BB6A" stroke-width="8" stroke-linecap="round"/>
    <rect x="-55" y="-5" width="22" height="16" rx="3" fill="url(#mapPaper)" stroke="#FFB300" stroke-width="1.5"/>
    <!-- Map markings -->
    <line x1="-52" y1="0" x2="-38" y2="0" stroke="#D7CCC8" stroke-width="0.8"/>
    <line x1="-50" y1="4" x2="-40" y2="4" stroke="#D7CCC8" stroke-width="0.8"/>
    <text x="-44" y="8" font-size="5" fill="#FF6F00" font-weight="bold">X</text>
    <!-- Map glow -->
    <circle cx="-44" cy="3" r="12" fill="#FFD54F" opacity="0.08"/>

    <!-- Legs (standing strong) -->
    <rect x="-20" y="38" width="14" height="22" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5"/>
    <rect x="6" y="38" width="14" height="22" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5"/>
    <!-- Boots -->
    <rect x="-24" y="56" width="22" height="10" rx="4" fill="#5D4037" stroke="#4E342E" stroke-width="1"/>
    <rect x="2" y="56" width="22" height="10" rx="4" fill="#5D4037" stroke="#4E342E" stroke-width="1"/>

    <!-- Backpack (side view hint) -->
    <rect x="-32" y="-10" width="8" height="18" rx="3" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <rect x="-32" y="-10" width="8" height="5" rx="2" fill="#6D4C41"/>

    <!-- Compass rose above (navigation spirit) -->
    <g transform="translate(0,-68)" opacity="0.5">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#FFD54F" stroke-width="1"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#FF8F00" stroke-width="1"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#FF8F00" stroke-width="1"/>
      <polygon points="0,-10 -2,-4 2,-4" fill="#F44336" opacity="0.6"/>
      <polygon points="0,10 -2,4 2,4" fill="#FFF" opacity="0.4"/>
    </g>

    <!-- Wind / adventure particles -->
    <circle cx="-50" cy="-20" r="2" fill="#FFD54F" opacity="0.3"/>
    <circle cx="55" cy="10" r="1.5" fill="#4CAF50" opacity="0.25"/>
    <circle cx="-45" cy="30" r="1.5" fill="#66BB6A" opacity="0.2"/>
    <circle cx="50" cy="-35" r="2" fill="#FFD54F" opacity="0.2"/>
  </g>

  <line x1="100" y1="480" x2="700" y2="480" stroke="#C8E6C9" stroke-width="1"/>

  <!-- Variations -->
  <text x="400" y="515" text-anchor="middle" font-size="16" font-weight="bold" fill="#1B5E20">Explorer Tribe Variations</text>

  <!-- Var 1: Desert Scout -->
  <g transform="translate(120, 640)">
    <circle cx="0" cy="0" r="48" fill="#FFF8E1" stroke="#FFE082" stroke-width="1.5"/>
    <!-- Sandy creature with goggles -->
    <ellipse cx="0" cy="5" rx="18" ry="20" fill="#FFE082"/>
    <circle cx="0" cy="-15" r="14" fill="#FFECB3"/>
    <!-- Goggles -->
    <ellipse cx="-6" cy="-17" rx="6" ry="5" fill="#FFF" stroke="#8D6E63" stroke-width="1.5"/>
    <ellipse cx="6" cy="-17" rx="6" ry="5" fill="#FFF" stroke="#8D6E63" stroke-width="1.5"/>
    <line x1="-12" y1="-17" x2="-16" y2="-15" stroke="#8D6E63" stroke-width="1.5"/>
    <line x1="12" y1="-17" x2="16" y2="-15" stroke="#8D6E63" stroke-width="1.5"/>
    <circle cx="-6" cy="-17" r="2.5" fill="#4FC3F7"/>
    <circle cx="6" cy="-17" r="2.5" fill="#4FC3F7"/>
    <!-- Scarf -->
    <path d="M-10,-8 Q0,-5 10,-8" fill="none" stroke="#FF8A65" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-3,-8 Q0,-6 3,-8" fill="none" stroke="#2E7D32" stroke-width="1" stroke-linecap="round"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#FF8F00">Sand Scout</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#FFB300">Desert Type</text>
  </g>

  <!-- Var 2: Deep Sea Diver -->
  <g transform="translate(280, 640)">
    <circle cx="0" cy="0" r="48" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1.5"/>
    <!-- Diving helmet creature -->
    <circle cx="0" cy="-5" r="20" fill="#607D8B" stroke="#455A64" stroke-width="2"/>
    <circle cx="0" cy="-5" r="14" fill="#E0F7FA" stroke="#78909C" stroke-width="1.5"/>
    <!-- Porthole window -->
    <circle cx="0" cy="-5" r="10" fill="#4FC3F7" opacity="0.4"/>
    <!-- Face behind glass -->
    <circle cx="-3" cy="-7" r="2" fill="#1B5E20"/>
    <circle cx="3" cy="-7" r="2" fill="#1B5E20"/>
    <path d="M-2,-1 Q0,1 2,-1" fill="none" stroke="#1B5E20" stroke-width="1" stroke-linecap="round"/>
    <!-- Bubbles -->
    <circle cx="15" cy="-18" r="3" fill="#E0F7FA" opacity="0.5" stroke="#80DEEA" stroke-width="0.5"/>
    <circle cx="20" cy="-25" r="2" fill="#E0F7FA" opacity="0.4" stroke="#80DEEA" stroke-width="0.5"/>
    <circle cx="12" cy="-28" r="1.5" fill="#E0F7FA" opacity="0.3"/>
    <!-- Body -->
    <rect x="-12" y="15" width="24" height="15" rx="5" fill="#78909C"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#0097A7">Deep Diver</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#00ACC1">Ocean Type</text>
  </g>

  <!-- Var 3: Sky Navigator -->
  <g transform="translate(440, 640)">
    <circle cx="0" cy="0" r="48" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5"/>
    <!-- Bird-like explorer -->
    <ellipse cx="0" cy="0" rx="16" ry="18" fill="#81D4FA"/>
    <circle cx="0" cy="-16" r="12" fill="#B3E5FC"/>
    <!-- Aviator goggles (on forehead) -->
    <rect x="-10" y="-25" width="20" height="6" rx="3" fill="#8D6E63" opacity="0.7"/>
    <circle cx="-5" cy="-22" r="4" fill="#FFF" opacity="0.5" stroke="#6D4C41" stroke-width="0.8"/>
    <circle cx="5" cy="-22" r="4" fill="#FFF" opacity="0.5" stroke="#6D4C41" stroke-width="0.8"/>
    <!-- Eyes -->
    <circle cx="-4" cy="-15" r="2.5" fill="#0D47A1"/>
    <circle cx="4" cy="-15" r="2.5" fill="#0D47A1"/>
    <path d="M-2,-10 Q0,-8 2,-10" fill="none" stroke="#0D47A1" stroke-width="0.8"/>
    <!-- Wings -->
    <path d="M-16,-2 Q-30,-10 -25,2" fill="#4FC3F7" opacity="0.5"/>
    <path d="M16,-2 Q30,-10 25,2" fill="#4FC3F7" opacity="0.5"/>
    <!-- Scarf -->
    <path d="M10,-8 Q15,-5 18,-10 Q20,-13 22,-8" fill="none" stroke="#F44336" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Sky Nav</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#42A5F5">Air Type</text>
  </g>

  <!-- Var 4: Legendary - World Walker -->
  <g transform="translate(600, 640)">
    <circle cx="0" cy="0" r="48" fill="#FFF8E1" stroke="#FFD54F" stroke-width="2"/>
    <!-- Ancient explorer with globe -->
    <ellipse cx="0" cy="5" rx="18" ry="20" fill="#66BB6A" stroke="#2E7D32" stroke-width="1"/>
    <circle cx="0" cy="-15" r="14" fill="#A5D6A7" stroke="#66BB6A" stroke-width="1"/>
    <!-- Crown of maps -->
    <path d="M-10,-25 Q-5,-35 0,-25 Q5,-35 10,-25" fill="#FFD54F" stroke="#FF8F00" stroke-width="1"/>
    <!-- Wise eyes -->
    <circle cx="-5" cy="-17" r="3" fill="#FFF"/>
    <circle cx="5" cy="-17" r="3" fill="#FFF"/>
    <circle cx="-5" cy="-17" r="2" fill="#1B5E20"/>
    <circle cx="5" cy="-17" r="2" fill="#1B5E20"/>
    <circle cx="-4" cy="-18" r="0.8" fill="#FFF"/>
    <circle cx="6" cy="-18" r="0.8" fill="#FFF"/>
    <!-- Knowing smile -->
    <path d="M-4,-10 Q0,-7 4,-10" fill="none" stroke="#1B5E20" stroke-width="1" stroke-linecap="round"/>
    <!-- Globe floating -->
    <circle cx="20" cy="-25" r="8" fill="#4FC3F7" opacity="0.4" stroke="#FFD54F" stroke-width="1"/>
    <path d="M15,-25 Q20,-30 25,-25" fill="none" stroke="#2E7D32" stroke-width="0.8" opacity="0.5"/>
    <line x1="20" y1="-33" x2="20" y2="-17" stroke="#FFD54F" stroke-width="0.5" opacity="0.4"/>
    <!-- Staff -->
    <line x1="-18" y1="-5" x2="-22" y2="25" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-22" cy="25" r="3" fill="#FFD54F" opacity="0.5"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFB300">World Walker</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#FFC107">Legendary</text>
  </g>

  <!-- Concept note -->
  <rect x="80" y="750" width="640" height="55" rx="10" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
  <text x="400" y="772" text-anchor="middle" font-size="11" fill="#1B5E20">CONCEPT: "동네 뒷산이 정글이고, 골목이 미궁이었던 그 시절의 탐험가"</text>
  <text x="400" y="790" text-anchor="middle" font-size="10" fill="#4CAF50">어른이 되어 잃어버린 '어디든 갈 수 있다'는 무한한 가능성. GPS가 아닌 나침반으로.</text>

  <!-- Color palette -->
  <text x="400" y="835" text-anchor="middle" font-size="10" fill="#4CAF50">Color Palette</text>
  <rect x="225" y="845" width="30" height="18" rx="4" fill="#1B5E20"/>
  <rect x="260" y="845" width="30" height="18" rx="4" fill="#66BB6A"/>
  <rect x="295" y="845" width="30" height="18" rx="4" fill="#A5D6A7"/>
  <rect x="330" y="845" width="30" height="18" rx="4" fill="#8D6E63"/>
  <rect x="365" y="845" width="30" height="18" rx="4" fill="#FFD54F"/>
  <rect x="400" y="845" width="30" height="18" rx="4" fill="#F44336"/>
  <rect x="435" y="845" width="30" height="18" rx="4" fill="#4FC3F7"/>
  <rect x="470" y="845" width="30" height="18" rx="4" fill="#FFECB3"/>
  <rect x="505" y="845" width="30" height="18" rx="4" fill="#5D4037"/>

  <text x="400" y="890" text-anchor="middle" font-size="10" fill="#81C784">BarcodeQuest Monster Design Sheet - EXPLORER / ADVENTURE TYPE</text>
</svg>
