<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="'Segoe UI', sans-serif">
  <rect width="800" height="900" fill="#FFFAF3"/>

  <text x="400" y="40" text-anchor="middle" font-size="11" fill="#8D6E63" letter-spacing="4">TYPE 04</text>
  <text x="400" y="72" text-anchor="middle" font-size="28" font-weight="bold" fill="#5D4037">PLUSH TOY / DOLL</text>
  <text x="400" y="95" text-anchor="middle" font-size="13" fill="#A1887F">"버리지 마... 아직 여기 있을게..."</text>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="#BCAAA4">토이스토리의 그 장면. 헤어진 장난감은 어디로 갔을까. 아직 기다리고 있을까.</text>

  <line x1="100" y1="130" x2="700" y2="130" stroke="#EFEBE9" stroke-width="1"/>

  <!-- Stage 1: Worn & Waiting -->
  <text x="200" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#A1887F">Stage 1: Worn &amp; Waiting</text>
  <text x="200" y="182" text-anchor="middle" font-size="10" fill="#BCAAA4">"...언젠간 다시 올 거야... 분명..."</text>

  <g transform="translate(200, 340)">
    <ellipse cx="0" cy="82" rx="40" ry="8" fill="#D7CCC8" opacity="0.3"/>

    <!-- Worn teddy bear -->
    <!-- Body -->
    <ellipse cx="0" cy="15" rx="30" ry="35" fill="#D7CCC8" stroke="#A1887F" stroke-width="2"/>
    <!-- Patches -->
    <ellipse cx="10" cy="25" rx="12" ry="8" fill="#BCAAA4" opacity="0.3" stroke="#A1887F" stroke-width="1" stroke-dasharray="3,2"/>
    <ellipse cx="-15" cy="5" rx="8" ry="6" fill="#BCAAA4" opacity="0.3" stroke="#A1887F" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- Belly -->
    <ellipse cx="0" cy="18" rx="18" ry="15" fill="#EFEBE9" stroke="#D7CCC8" stroke-width="1"/>

    <!-- Head -->
    <circle cx="0" cy="-30" r="25" fill="#D7CCC8" stroke="#A1887F" stroke-width="2"/>
    <!-- Ears -->
    <circle cx="-20" cy="-50" r="10" fill="#D7CCC8" stroke="#A1887F" stroke-width="2"/>
    <circle cx="20" cy="-50" r="10" fill="#D7CCC8" stroke="#A1887F" stroke-width="2"/>
    <circle cx="-20" cy="-50" r="5" fill="#BCAAA4"/>
    <circle cx="20" cy="-50" r="5" fill="#BCAAA4"/>

    <!-- Button eyes (one loose) -->
    <circle cx="-8" cy="-33" r="5" fill="#795548" stroke="#5D4037" stroke-width="1.5"/>
    <line x1="-8" y1="-36" x2="-8" y2="-30" stroke="#D7CCC8" stroke-width="1"/>
    <line x1="-11" y1="-33" x2="-5" y2="-33" stroke="#D7CCC8" stroke-width="1"/>
    <!-- One eye hanging by thread -->
    <path d="M8,-33 Q10,-28 12,-25" fill="none" stroke="#A1887F" stroke-width="1" stroke-dasharray="2,1"/>
    <circle cx="12" cy="-25" r="4.5" fill="#795548" stroke="#5D4037" stroke-width="1.5"/>
    <line x1="12" y1="-28" x2="12" y2="-22" stroke="#D7CCC8" stroke-width="1"/>

    <!-- Stitched smile (slightly undone) -->
    <path d="M-8,-22 L-4,-19 L0,-22 L4,-19 L8,-22" fill="none" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8,-22 Q10,-20 12,-22" fill="none" stroke="#5D4037" stroke-width="1" stroke-dasharray="2,1" opacity="0.5"/>

    <!-- Stuffing peeking out -->
    <circle cx="22" cy="0" r="4" fill="#FFF" opacity="0.5"/>
    <circle cx="24" cy="5" r="3" fill="#FFF" opacity="0.4"/>

    <!-- Arms (one hanging) -->
    <ellipse cx="-32" cy="5" rx="8" ry="15" fill="#D7CCC8" stroke="#A1887F" stroke-width="1.5" transform="rotate(15,-32,5)"/>
    <ellipse cx="30" cy="12" rx="8" ry="15" fill="#D7CCC8" stroke="#A1887F" stroke-width="1.5" transform="rotate(-25,30,12)"/>

    <!-- Legs -->
    <ellipse cx="-12" cy="50" rx="10" ry="12" fill="#D7CCC8" stroke="#A1887F" stroke-width="1.5"/>
    <ellipse cx="12" cy="50" rx="10" ry="12" fill="#D7CCC8" stroke="#A1887F" stroke-width="1.5"/>

    <!-- Old ribbon (faded) -->
    <path d="M-8,-12 Q-15,-18 -12,-8" fill="#FFAB91" opacity="0.3"/>
    <path d="M8,-12 Q15,-18 12,-8" fill="#FFAB91" opacity="0.3"/>
    <circle cx="0" cy="-13" r="3" fill="#FFAB91" opacity="0.4"/>

    <!-- Dust particles -->
    <circle cx="-25" cy="-15" r="1" fill="#BCAAA4" opacity="0.3"/>
    <circle cx="28" cy="-20" r="1.5" fill="#BCAAA4" opacity="0.2"/>
  </g>

  <!-- Stage 3: Beloved Again -->
  <text x="600" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#795548">Stage 3: Beloved Again</text>
  <text x="600" y="182" text-anchor="middle" font-size="10" fill="#A1887F">"다시 안아줘서 고마워... 따뜻해..."</text>

  <g transform="translate(600, 330)">
    <ellipse cx="0" cy="90" rx="50" ry="10" fill="#FFAB91" opacity="0.1"/>

    <!-- Warm glow -->
    <circle cx="0" cy="5" r="70" fill="#FFAB91" opacity="0.04"/>

    <!-- Restored teddy -->
    <ellipse cx="0" cy="15" rx="33" ry="38" fill="#D7CCC8" stroke="#8D6E63" stroke-width="2"/>
    <!-- Patches (now golden stitched - kintsugi style) -->
    <ellipse cx="10" cy="25" rx="12" ry="8" fill="#BCAAA4" opacity="0.3" stroke="#FFD54F" stroke-width="1.5"/>
    <ellipse cx="-15" cy="5" rx="8" ry="6" fill="#BCAAA4" opacity="0.3" stroke="#FFD54F" stroke-width="1.5"/>
    <!-- Belly -->
    <ellipse cx="0" cy="18" rx="20" ry="17" fill="#EFEBE9" stroke="#D7CCC8" stroke-width="1"/>
    <!-- Heart in belly -->
    <path d="M0,12 C0,8 -5,6 -5,10 C-5,6 -10,8 -10,12 C-10,18 0,22 0,22 C0,22 10,18 10,12 C10,8 5,6 5,10 C5,6 0,8 0,12Z" fill="#FF8A65" opacity="0.5"/>

    <!-- Head -->
    <circle cx="0" cy="-30" r="28" fill="#D7CCC8" stroke="#8D6E63" stroke-width="2"/>
    <!-- Ears -->
    <circle cx="-22" cy="-52" r="11" fill="#D7CCC8" stroke="#8D6E63" stroke-width="2"/>
    <circle cx="22" cy="-52" r="11" fill="#D7CCC8" stroke="#8D6E63" stroke-width="2"/>
    <circle cx="-22" cy="-52" r="6" fill="#FFAB91" opacity="0.5"/>
    <circle cx="22" cy="-52" r="6" fill="#FFAB91" opacity="0.5"/>

    <!-- Button eyes (both fixed, shiny) -->
    <circle cx="-9" cy="-33" r="6" fill="#795548" stroke="#5D4037" stroke-width="2"/>
    <circle cx="9" cy="-33" r="6" fill="#795548" stroke="#5D4037" stroke-width="2"/>
    <line x1="-9" y1="-36" x2="-9" y2="-30" stroke="#D7CCC8" stroke-width="1"/>
    <line x1="-12" y1="-33" x2="-6" y2="-33" stroke="#D7CCC8" stroke-width="1"/>
    <line x1="9" y1="-36" x2="9" y2="-30" stroke="#D7CCC8" stroke-width="1"/>
    <line x1="6" y1="-33" x2="12" y2="-33" stroke="#D7CCC8" stroke-width="1"/>
    <!-- Eye shine -->
    <circle cx="-7" cy="-35" r="1.5" fill="#FFF" opacity="0.6"/>
    <circle cx="11" cy="-35" r="1.5" fill="#FFF" opacity="0.6"/>

    <!-- Stitched smile (neat, happy) -->
    <path d="M-10,-20 L-6,-16 L-2,-20 L2,-16 L6,-20 L10,-16" fill="none" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Blush -->
    <ellipse cx="-16" cy="-24" rx="6" ry="3.5" fill="#FFAB91" opacity="0.4"/>
    <ellipse cx="16" cy="-24" rx="6" ry="3.5" fill="#FFAB91" opacity="0.4"/>

    <!-- Arms (hugging pose) -->
    <ellipse cx="-35" cy="0" rx="10" ry="18" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5" transform="rotate(20,-35,0)"/>
    <ellipse cx="35" cy="0" rx="10" ry="18" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5" transform="rotate(-20,35,0)"/>

    <!-- Legs -->
    <ellipse cx="-14" cy="52" rx="12" ry="14" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5"/>
    <ellipse cx="14" cy="52" rx="12" ry="14" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5"/>

    <!-- New ribbon (bright) -->
    <path d="M-10,-12 Q-18,-20 -14,-8" fill="#FF8A65" opacity="0.7"/>
    <path d="M10,-12 Q18,-20 14,-8" fill="#FF8A65" opacity="0.7"/>
    <circle cx="0" cy="-13" r="4" fill="#FF5722" opacity="0.6"/>

    <!-- Golden stitch lines (kintsugi) -->
    <line x1="18" y1="-5" x2="25" y2="5" stroke="#FFD54F" stroke-width="1.5" opacity="0.5"/>

    <!-- Warmth particles -->
    <circle cx="-35" cy="-20" r="2" fill="#FFAB91" opacity="0.3"/>
    <circle cx="40" cy="-15" r="1.5" fill="#FFAB91" opacity="0.25"/>
    <circle cx="-30" cy="25" r="1.5" fill="#FFD54F" opacity="0.2"/>
    <circle cx="35" cy="30" r="2" fill="#FFD54F" opacity="0.2"/>
  </g>

  <line x1="100" y1="475" x2="700" y2="475" stroke="#EFEBE9" stroke-width="1"/>

  <!-- Variations -->
  <text x="400" y="510" text-anchor="middle" font-size="16" font-weight="bold" fill="#5D4037">Plush Toy Tribe Variations</text>

  <!-- Var 1: Knitted Bunny -->
  <g transform="translate(120, 640)">
    <circle cx="0" cy="0" r="48" fill="#FFFAF3" stroke="#EFEBE9" stroke-width="1.5"/>
    <!-- Knitted rabbit -->
    <ellipse cx="0" cy="5" rx="16" ry="18" fill="#F8BBD0" stroke="#EC407A" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="0" cy="-15" r="12" fill="#FCE4EC" stroke="#F48FB1" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- Long ears -->
    <ellipse cx="-6" cy="-35" rx="5" ry="15" fill="#F8BBD0" stroke="#F48FB1" stroke-width="1" stroke-dasharray="2,2"/>
    <ellipse cx="6" cy="-35" rx="5" ry="15" fill="#F8BBD0" stroke="#F48FB1" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- X eyes (cute style) -->
    <text x="-4" y="-13" font-size="7" fill="#EC407A">x</text>
    <text x="3" y="-13" font-size="7" fill="#EC407A">x</text>
    <path d="M-2,-8 Q0,-6 2,-8" fill="none" stroke="#EC407A" stroke-width="0.8"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#5D4037">Knit Bunny</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#A1887F">Comfort Type</text>
  </g>

  <!-- Var 2: Wind-up Tin Toy -->
  <g transform="translate(280, 640)">
    <circle cx="0" cy="0" r="48" fill="#FFFAF3" stroke="#EFEBE9" stroke-width="1.5"/>
    <!-- Tin toy soldier -->
    <rect x="-12" y="-10" width="24" height="30" rx="3" fill="#90CAF9" stroke="#42A5F5" stroke-width="1.5"/>
    <circle cx="0" cy="-22" r="10" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5"/>
    <!-- Hat -->
    <rect x="-8" y="-32" width="16" height="5" rx="2" fill="#1565C0"/>
    <circle cx="-4" cy="-24" r="2" fill="#1565C0"/>
    <circle cx="4" cy="-24" r="2" fill="#1565C0"/>
    <path d="M-3,-18 Q0,-16 3,-18" fill="none" stroke="#1565C0" stroke-width="0.8"/>
    <!-- Wind-up key on back -->
    <circle cx="15" cy="0" r="5" fill="#FFD54F" stroke="#FFC107" stroke-width="1"/>
    <line x1="15" y1="-2" x2="15" y2="2" stroke="#FFC107" stroke-width="1.5"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#5D4037">Tin Soldier</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#A1887F">Guard Type</text>
  </g>

  <!-- Var 3: Sock Puppet -->
  <g transform="translate(440, 640)">
    <circle cx="0" cy="0" r="48" fill="#FFFAF3" stroke="#EFEBE9" stroke-width="1.5"/>
    <!-- Sock puppet -->
    <path d="M-15,20 Q-18,-5 -10,-15 Q0,-22 10,-15 Q18,-5 15,20Z" fill="#C8E6C9" stroke="#66BB6A" stroke-width="1.5"/>
    <!-- Googly eyes -->
    <circle cx="-6" cy="-8" r="6" fill="#FFF" stroke="#333" stroke-width="1"/>
    <circle cx="6" cy="-8" r="6" fill="#FFF" stroke="#333" stroke-width="1"/>
    <circle cx="-4" cy="-7" r="3" fill="#333"/>
    <circle cx="8" cy="-6" r="3" fill="#333"/>
    <!-- Mouth (felt) -->
    <ellipse cx="0" cy="3" rx="8" ry="5" fill="#EF5350" opacity="0.6"/>
    <!-- Yarn hair -->
    <path d="M-8,-18 Q-12,-25 -6,-22" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,-20 Q0,-28 4,-24" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <path d="M8,-18 Q12,-25 6,-22" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#5D4037">Sock Pal</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#A1887F">Fun Type</text>
  </g>

  <!-- Var 4: Legendary - Golden Bear -->
  <g transform="translate(600, 640)">
    <circle cx="0" cy="0" r="48" fill="#FFF8E1" stroke="#FFD54F" stroke-width="2"/>
    <!-- Golden antique bear -->
    <ellipse cx="0" cy="5" rx="18" ry="20" fill="#FFE082" stroke="#FFB300" stroke-width="1.5"/>
    <circle cx="0" cy="-18" r="14" fill="#FFECB3" stroke="#FFB300" stroke-width="1.5"/>
    <!-- Gem eyes -->
    <circle cx="-5" cy="-20" r="3.5" fill="#FF6F00" stroke="#E65100" stroke-width="1"/>
    <circle cx="5" cy="-20" r="3.5" fill="#FF6F00" stroke="#E65100" stroke-width="1"/>
    <circle cx="-4" cy="-21" r="1.2" fill="#FFD54F"/>
    <circle cx="6" cy="-21" r="1.2" fill="#FFD54F"/>
    <!-- Crown -->
    <path d="M-8,-30 L-5,-38 L0,-30 L5,-38 L8,-30" fill="#FFD54F" stroke="#FFB300" stroke-width="1"/>
    <!-- Golden stitches -->
    <line x1="-10" y1="-12" x2="-5" y2="-8" stroke="#FFD54F" stroke-width="1.2"/>
    <line x1="10" y1="-12" x2="5" y2="-8" stroke="#FFD54F" stroke-width="1.2"/>
    <!-- Ears -->
    <circle cx="-12" cy="-28" r="6" fill="#FFECB3" stroke="#FFB300" stroke-width="1"/>
    <circle cx="12" cy="-28" r="6" fill="#FFECB3" stroke="#FFB300" stroke-width="1"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFB300">Golden Bear</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#FFC107">Legendary</text>
  </g>

  <!-- Concept note -->
  <rect x="80" y="750" width="640" height="55" rx="10" fill="#EFEBE9"/>
  <text x="400" y="772" text-anchor="middle" font-size="11" fill="#5D4037">CONCEPT: "다락방 깊이 넣어둔 곰인형, 솜 빠진 토끼 인형"</text>
  <text x="400" y="790" text-anchor="middle" font-size="10" fill="#A1887F">낡고 해졌지만, 금으로 꿰맨 상처는 오히려 더 아름답다 (킨츠기)</text>

  <!-- Color palette -->
  <text x="400" y="835" text-anchor="middle" font-size="10" fill="#A1887F">Color Palette</text>
  <rect x="225" y="845" width="30" height="18" rx="4" fill="#D7CCC8"/>
  <rect x="260" y="845" width="30" height="18" rx="4" fill="#8D6E63"/>
  <rect x="295" y="845" width="30" height="18" rx="4" fill="#EFEBE9"/>
  <rect x="330" y="845" width="30" height="18" rx="4" fill="#FFAB91"/>
  <rect x="365" y="845" width="30" height="18" rx="4" fill="#FFD54F"/>
  <rect x="400" y="845" width="30" height="18" rx="4" fill="#795548"/>
  <rect x="435" y="845" width="30" height="18" rx="4" fill="#F8BBD0"/>
  <rect x="470" y="845" width="30" height="18" rx="4" fill="#90CAF9"/>
  <rect x="505" y="845" width="30" height="18" rx="4" fill="#C8E6C9"/>

  <text x="400" y="890" text-anchor="middle" font-size="10" fill="#BCAAA4">BarcodeQuest Monster Design Sheet - PLUSH TOY TYPE</text>
</svg>
