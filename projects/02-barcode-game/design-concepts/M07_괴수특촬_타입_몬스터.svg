<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="kaijuSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#558B2F"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>
    <linearGradient id="kaijuGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#DD2C00"/>
    </linearGradient>
    <linearGradient id="ultraBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="50%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="#1A0A00"/>

  <text x="400" y="40" text-anchor="middle" font-size="11" fill="#FF6D00" letter-spacing="4">TYPE 07</text>
  <text x="400" y="72" text-anchor="middle" font-size="28" font-weight="bold" fill="#FF3D00">KAIJU / TOKUSATSU</text>
  <text x="400" y="95" text-anchor="middle" font-size="13" fill="#FF8A65">"거실 TV 앞에서 괴수 흉내내던 그 꼬마"</text>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="#BF360C">소프비 피규어를 들고 "쿵! 슈왓!" 소리 지르던 아이. 그 괴수는 아직 살아있다.</text>

  <line x1="100" y1="130" x2="700" y2="130" stroke="#3E2723" stroke-width="1"/>

  <!-- Stage 1: Dormant / Toy-sized -->
  <text x="200" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#A1887F">Stage 1: Dormant</text>
  <text x="200" y="182" text-anchor="middle" font-size="10" fill="#8D6E63">"...크아아... (작은 소리)"</text>

  <g transform="translate(200, 345)">
    <ellipse cx="0" cy="80" rx="45" ry="10" fill="#FF6D00" opacity="0.08"/>

    <!-- Small, faded sofubi figure -->
    <!-- Body (plastic-toy feel, faded) -->
    <path d="M-25,10 Q-30,-15 -20,-30 Q0,-42 20,-30 Q30,-15 25,10 Q20,50 -20,50Z" fill="#8D6E63" opacity="0.6" stroke="#6D4C41" stroke-width="1.5"/>
    <path d="M-18,8 Q-22,-10 -14,-22 Q0,-32 14,-22 Q22,-10 18,8 Q14,40 -14,40Z" fill="#A1887F" opacity="0.5"/>

    <!-- Head (toy proportions - big head) -->
    <ellipse cx="0" cy="-38" rx="28" ry="22" fill="#8D6E63" opacity="0.6" stroke="#6D4C41" stroke-width="1.5"/>
    <!-- Faded ridges/horns -->
    <path d="M-15,-52 L-18,-65 L-10,-55" fill="#795548" opacity="0.3"/>
    <path d="M15,-52 L18,-65 L10,-55" fill="#795548" opacity="0.3"/>
    <path d="M0,-55 L0,-68 L5,-57" fill="#795548" opacity="0.3"/>

    <!-- Eyes (dim, unfocused) -->
    <ellipse cx="-10" cy="-40" rx="6" ry="5" fill="#4E342E" opacity="0.4"/>
    <ellipse cx="10" cy="-40" rx="6" ry="5" fill="#4E342E" opacity="0.4"/>
    <circle cx="-10" cy="-40" r="3" fill="#FF6D00" opacity="0.15"/>
    <circle cx="10" cy="-40" r="3" fill="#FF6D00" opacity="0.15"/>

    <!-- Closed/tired mouth -->
    <path d="M-10,-28 Q0,-25 10,-28" fill="none" stroke="#5D4037" stroke-width="1.5" opacity="0.4"/>

    <!-- Tiny arms (hanging) -->
    <path d="M-25,-5 Q-35,0 -32,15" fill="none" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <path d="M25,-5 Q35,0 32,15" fill="none" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- Small tail (drooping) -->
    <path d="M15,35 Q25,40 22,50 Q20,55 25,52" fill="none" stroke="#8D6E63" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

    <!-- Paint chipping marks -->
    <circle cx="-12" cy="5" r="4" fill="#6D4C41" opacity="0.2"/>
    <circle cx="18" cy="-10" r="3" fill="#6D4C41" opacity="0.15"/>

    <!-- Faded dorsal plates -->
    <path d="M-5,-30 L-3,-38 L-1,-30" fill="#795548" opacity="0.2"/>
    <path d="M1,-28 L3,-35 L5,-28" fill="#795548" opacity="0.2"/>
  </g>

  <!-- Stage 3: AWAKENED KAIJU -->
  <text x="600" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#FF3D00">Stage 3: AWAKENED</text>
  <text x="600" y="182" text-anchor="middle" font-size="10" fill="#FF6D00">"크아아아아아!!! (도시가 떨린다)"</text>

  <g transform="translate(600, 330)">
    <ellipse cx="0" cy="95" rx="60" ry="12" fill="#FF6D00" opacity="0.12"/>

    <!-- Energy aura (destructive) -->
    <circle cx="0" cy="5" r="85" fill="#FF6D00" opacity="0.03"/>
    <circle cx="0" cy="5" r="70" fill="#DD2C00" opacity="0.04"/>

    <!-- Massive body -->
    <path d="M-35,15 Q-42,-20 -28,-42 Q0,-60 28,-42 Q42,-20 35,15 Q28,65 -28,65Z" fill="url(#kaijuSkin)" stroke="#1B5E20" stroke-width="2"/>
    <path d="M-25,12 Q-30,-12 -20,-30 Q0,-42 20,-30 Q30,-12 25,12 Q20,50 -20,50Z" fill="#689F38" opacity="0.6"/>

    <!-- Belly plates -->
    <rect x="-18" y="-5" width="36" height="40" rx="8" fill="#9E9D24" opacity="0.3" stroke="#827717" stroke-width="1"/>
    <line x1="-14" y1="5" x2="14" y2="5" stroke="#827717" stroke-width="0.5" opacity="0.4"/>
    <line x1="-16" y1="13" x2="16" y2="13" stroke="#827717" stroke-width="0.5" opacity="0.4"/>
    <line x1="-14" y1="21" x2="14" y2="21" stroke="#827717" stroke-width="0.5" opacity="0.4"/>

    <!-- Head (fierce, kaiju proportions) -->
    <ellipse cx="0" cy="-45" rx="32" ry="25" fill="url(#kaijuSkin)" stroke="#1B5E20" stroke-width="2"/>
    <ellipse cx="0" cy="-42" rx="26" ry="20" fill="#558B2F" opacity="0.7"/>

    <!-- Dorsal plates (GLOWING) -->
    <path d="M-8,-60 L-5,-78 L-2,-60" fill="#FF6D00" opacity="0.7" stroke="#DD2C00" stroke-width="1"/>
    <path d="M2,-62 L5,-82 L8,-62" fill="#FF6D00" opacity="0.8" stroke="#DD2C00" stroke-width="1"/>
    <path d="M-15,-55 L-12,-68 L-9,-55" fill="#FF8F00" opacity="0.5"/>
    <path d="M9,-55 L12,-68 L15,-55" fill="#FF8F00" opacity="0.5"/>
    <!-- Glow from plates -->
    <circle cx="0" cy="-72" r="10" fill="#FF6D00" opacity="0.1"/>
    <circle cx="0" cy="-72" r="6" fill="#FF6D00" opacity="0.08"/>

    <!-- Horns -->
    <path d="M-18,-58 L-25,-75 L-12,-60" fill="#33691E" stroke="#1B5E20" stroke-width="1"/>
    <path d="M18,-58 L25,-75 L12,-60" fill="#33691E" stroke="#1B5E20" stroke-width="1"/>

    <!-- FIERCE EYES (glowing orange) -->
    <ellipse cx="-12" cy="-48" rx="8" ry="6" fill="#1B5E20"/>
    <ellipse cx="12" cy="-48" rx="8" ry="6" fill="#1B5E20"/>
    <ellipse cx="-12" cy="-48" rx="6" ry="4" fill="#FF6D00" opacity="0.9"/>
    <ellipse cx="12" cy="-48" rx="6" ry="4" fill="#FF6D00" opacity="0.9"/>
    <ellipse cx="-12" cy="-48" rx="3" ry="2" fill="#FFF" opacity="0.5"/>
    <ellipse cx="12" cy="-48" rx="3" ry="2" fill="#FFF" opacity="0.5"/>

    <!-- ROARING MOUTH -->
    <path d="M-15,-32 Q0,-25 15,-32 Q12,-38 0,-35 Q-12,-38 -15,-32Z" fill="#1B5E20" stroke="#33691E" stroke-width="1"/>
    <!-- Teeth -->
    <path d="M-12,-33 L-10,-29 L-8,-33" fill="#FFF" opacity="0.8"/>
    <path d="M-5,-34 L-3,-29 L-1,-34" fill="#FFF" opacity="0.8"/>
    <path d="M2,-34 L4,-29 L6,-34" fill="#FFF" opacity="0.8"/>
    <path d="M9,-33 L11,-29 L13,-33" fill="#FFF" opacity="0.8"/>

    <!-- Powerful arms -->
    <path d="M-35,-10 Q-50,-15 -48,5 L-42,15 L-35,5Z" fill="#558B2F" stroke="#33691E" stroke-width="1.5"/>
    <path d="M35,-10 Q50,-15 48,5 L42,15 L35,5Z" fill="#558B2F" stroke="#33691E" stroke-width="1.5"/>
    <!-- Claws -->
    <line x1="-48" y1="5" x2="-55" y2="0" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-45" y1="10" x2="-52" y2="8" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="48" y1="5" x2="55" y2="0" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="45" y1="10" x2="52" y2="8" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Thick tail -->
    <path d="M22,50 Q40,55 45,45 Q50,35 55,40 Q62,45 58,35" fill="none" stroke="#558B2F" stroke-width="8" stroke-linecap="round"/>
    <path d="M55,40 Q60,42 62,38" fill="none" stroke="#689F38" stroke-width="4" stroke-linecap="round"/>

    <!-- Legs -->
    <rect x="-28" y="55" width="20" height="25" rx="5" fill="#33691E" stroke="#1B5E20" stroke-width="1.5"/>
    <rect x="8" y="55" width="20" height="25" rx="5" fill="#33691E" stroke="#1B5E20" stroke-width="1.5"/>
    <rect x="-32" y="76" width="28" height="10" rx="4" fill="#1B5E20"/>
    <rect x="4" y="76" width="28" height="10" rx="4" fill="#1B5E20"/>

    <!-- ATOMIC BREATH CHARGE -->
    <circle cx="0" cy="-32" r="8" fill="#FF6D00" opacity="0.2"/>
    <circle cx="0" cy="-32" r="5" fill="#FFD54F" opacity="0.15"/>

    <!-- Destruction particles -->
    <circle cx="-55" cy="-30" r="2" fill="#FF6D00" opacity="0.3"/>
    <circle cx="60" cy="-20" r="2.5" fill="#DD2C00" opacity="0.25"/>
    <circle cx="-50" cy="20" r="1.5" fill="#FF8F00" opacity="0.2"/>
    <circle cx="55" cy="25" r="2" fill="#FF6D00" opacity="0.2"/>

    <!-- Impact lines -->
    <line x1="-65" y1="-5" x2="-55" y2="0" stroke="#FF6D00" stroke-width="1.5" opacity="0.2"/>
    <line x1="65" y1="-5" x2="55" y2="0" stroke="#FF6D00" stroke-width="1.5" opacity="0.2"/>
  </g>

  <line x1="100" y1="480" x2="700" y2="480" stroke="#3E2723" stroke-width="1"/>

  <!-- Variations -->
  <text x="400" y="515" text-anchor="middle" font-size="16" font-weight="bold" fill="#FF3D00">Kaiju Tribe Variations</text>

  <!-- Var 1: Moth Kaiju (Mothra-inspired) -->
  <g transform="translate(120, 640)">
    <circle cx="0" cy="0" r="48" fill="#1A0A00" stroke="#3E2723" stroke-width="1.5"/>
    <!-- Moth wings -->
    <ellipse cx="-18" cy="-3" rx="18" ry="12" fill="#FF8F00" opacity="0.4" transform="rotate(-10,-18,-3)"/>
    <ellipse cx="18" cy="-3" rx="18" ry="12" fill="#FF8F00" opacity="0.4" transform="rotate(10,18,-3)"/>
    <ellipse cx="-15" cy="-3" rx="12" ry="8" fill="#FFD54F" opacity="0.3"/>
    <ellipse cx="15" cy="-3" rx="12" ry="8" fill="#FFD54F" opacity="0.3"/>
    <!-- Body -->
    <ellipse cx="0" cy="2" rx="8" ry="14" fill="#8D6E63"/>
    <circle cx="0" cy="-12" r="8" fill="#A1887F"/>
    <!-- Eyes -->
    <circle cx="-3" cy="-14" r="3" fill="#00B0FF" opacity="0.7"/>
    <circle cx="3" cy="-14" r="3" fill="#00B0FF" opacity="0.7"/>
    <!-- Antenna -->
    <path d="M-3,-18 Q-8,-28 -12,-25" fill="none" stroke="#BCAAA4" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M3,-18 Q8,-28 12,-25" fill="none" stroke="#BCAAA4" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#FF8F00">Moth Queen</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#BF360C">Mystic Type</text>
  </g>

  <!-- Var 2: Mecha-Kaiju (MechaGodzilla-inspired) -->
  <g transform="translate(280, 640)">
    <circle cx="0" cy="0" r="48" fill="#1A0A00" stroke="#3E2723" stroke-width="1.5"/>
    <!-- Metal dragon head -->
    <rect x="-15" y="-12" width="30" height="30" rx="4" fill="#607D8B"/>
    <rect x="-18" y="-20" width="36" height="14" rx="5" fill="#78909C"/>
    <!-- Visor eyes -->
    <rect x="-12" y="-18" width="10" height="5" rx="2" fill="#FF1744" opacity="0.7"/>
    <rect x="2" y="-18" width="10" height="5" rx="2" fill="#FF1744" opacity="0.7"/>
    <!-- Metal jaw -->
    <rect x="-12" y="-8" width="24" height="6" rx="2" fill="#546E7A"/>
    <line x1="-8" y1="-5" x2="-4" y2="-5" stroke="#455A64" stroke-width="1"/>
    <line x1="0" y1="-5" x2="4" y2="-5" stroke="#455A64" stroke-width="1"/>
    <!-- Horns -->
    <line x1="-12" y1="-18" x2="-18" y2="-30" stroke="#90A4AE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-18" x2="18" y2="-30" stroke="#90A4AE" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chest core -->
    <circle cx="0" cy="5" r="5" fill="#FF1744" opacity="0.4"/>
    <circle cx="0" cy="5" r="3" fill="#FF1744" opacity="0.3"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#78909C">Mecha Rex</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#546E7A">Armor Type</text>
  </g>

  <!-- Var 3: Sea Kaiju -->
  <g transform="translate(440, 640)">
    <circle cx="0" cy="0" r="48" fill="#1A0A00" stroke="#3E2723" stroke-width="1.5"/>
    <!-- Sea creature body -->
    <ellipse cx="0" cy="0" rx="25" ry="20" fill="#00695C" opacity="0.7"/>
    <circle cx="0" cy="-15" r="14" fill="#00897B" opacity="0.8"/>
    <!-- Tentacles -->
    <path d="M-18,12 Q-25,22 -20,28" fill="none" stroke="#00695C" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M-10,15 Q-15,25 -8,30" fill="none" stroke="#00695C" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M10,15 Q15,25 8,30" fill="none" stroke="#00695C" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M18,12 Q25,22 20,28" fill="none" stroke="#00695C" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Big eyes -->
    <circle cx="-6" cy="-18" r="5" fill="#E0F7FA"/>
    <circle cx="6" cy="-18" r="5" fill="#E0F7FA"/>
    <circle cx="-6" cy="-18" r="3" fill="#004D40"/>
    <circle cx="6" cy="-18" r="3" fill="#004D40"/>
    <!-- Fin -->
    <path d="M0,-28 L-5,-38 L5,-38Z" fill="#26A69A" opacity="0.6"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#26A69A">Deep One</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#00897B">Ocean Type</text>
  </g>

  <!-- Var 4: Legendary Ultra Kaiju -->
  <g transform="translate(600, 640)">
    <circle cx="0" cy="0" r="48" fill="#1A0A00" stroke="#FFD54F" stroke-width="2"/>
    <!-- Cosmic kaiju -->
    <path d="M0,-28 Q-20,-15 -18,5 Q-15,25 0,28 Q15,25 18,5 Q20,-15 0,-28Z" fill="#311B92" opacity="0.7"/>
    <path d="M0,-22 Q-14,-12 -12,4 Q-10,18 0,22 Q10,18 12,4 Q14,-12 0,-22Z" fill="#4527A0" opacity="0.6"/>
    <!-- Galaxy pattern on body -->
    <circle cx="-5" cy="0" r="2" fill="#FFF" opacity="0.3"/>
    <circle cx="8" cy="5" r="1.5" fill="#FFF" opacity="0.2"/>
    <circle cx="-3" cy="12" r="1" fill="#FFF" opacity="0.25"/>
    <circle cx="5" cy="-8" r="1.5" fill="#FFD54F" opacity="0.3"/>
    <!-- Eyes (cosmic) -->
    <ellipse cx="-7" cy="-12" rx="5" ry="4" fill="#000"/>
    <ellipse cx="7" cy="-12" rx="5" ry="4" fill="#000"/>
    <circle cx="-7" cy="-12" r="3" fill="#FFD54F" opacity="0.8"/>
    <circle cx="7" cy="-12" r="3" fill="#FFD54F" opacity="0.8"/>
    <!-- Crown horns -->
    <path d="M-10,-22 L-15,-35" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,-25 L0,-40" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <path d="M10,-22 L15,-35" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-15" cy="-35" r="2" fill="#FFD54F" opacity="0.5"/>
    <circle cx="0" cy="-40" r="2.5" fill="#FFD54F" opacity="0.6"/>
    <circle cx="15" cy="-35" r="2" fill="#FFD54F" opacity="0.5"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD54F">Cosmos King</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#FFC107">Legendary</text>
  </g>

  <!-- Concept note -->
  <rect x="80" y="750" width="640" height="55" rx="10" fill="#2A1500" stroke="#3E2723" stroke-width="1"/>
  <text x="400" y="772" text-anchor="middle" font-size="11" fill="#FF3D00">CONCEPT: "소프비 피규어 들고 '쿵! 쾅!' 소리 내던 그 시절"</text>
  <text x="400" y="790" text-anchor="middle" font-size="10" fill="#BF360C">페인트 벗겨진 장난감 괴수가 다시 포효한다. 그 아이의 상상력이 되돌아오면.</text>

  <!-- Color palette -->
  <text x="400" y="835" text-anchor="middle" font-size="10" fill="#BF360C">Color Palette</text>
  <rect x="225" y="845" width="30" height="18" rx="4" fill="#33691E"/>
  <rect x="260" y="845" width="30" height="18" rx="4" fill="#558B2F"/>
  <rect x="295" y="845" width="30" height="18" rx="4" fill="#FF6D00"/>
  <rect x="330" y="845" width="30" height="18" rx="4" fill="#DD2C00"/>
  <rect x="365" y="845" width="30" height="18" rx="4" fill="#8D6E63"/>
  <rect x="400" y="845" width="30" height="18" rx="4" fill="#607D8B"/>
  <rect x="435" y="845" width="30" height="18" rx="4" fill="#00695C"/>
  <rect x="470" y="845" width="30" height="18" rx="4" fill="#311B92"/>
  <rect x="505" y="845" width="30" height="18" rx="4" fill="#FFD54F"/>

  <text x="400" y="890" text-anchor="middle" font-size="10" fill="#5D4037">BarcodeQuest Monster Design Sheet - KAIJU / TOKUSATSU TYPE</text>
</svg>
