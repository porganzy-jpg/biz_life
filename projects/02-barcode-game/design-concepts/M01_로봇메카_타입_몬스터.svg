<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="metalBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78909C"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <linearGradient id="energyCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <linearGradient id="rustMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="40%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="#1A1A2E"/>

  <!-- Header -->
  <text x="400" y="40" text-anchor="middle" font-size="11" fill="#546E7A" letter-spacing="4">TYPE 01</text>
  <text x="400" y="72" text-anchor="middle" font-size="28" font-weight="bold" fill="#00E5FF">MECHA / ROBOT</text>
  <text x="400" y="95" text-anchor="middle" font-size="13" fill="#546E7A">"토요일 아침, TV 앞에서 눈을 빛내던 그 아이의 꿈"</text>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="#37474F">한때 무적이었던 로봇 친구. 어른이 되니 녹슬고 작아졌지만, 아직 심장은 뛴다.</text>

  <line x1="100" y1="130" x2="700" y2="130" stroke="#263238" stroke-width="1"/>

  <!-- Main Character: 볼트 (Bolt) - Stage 1 (녹슬고 작아진 상태) -->
  <text x="200" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#78909C">Stage 1: Forgotten</text>
  <text x="200" y="182" text-anchor="middle" font-size="10" fill="#546E7A">"...아직 움직여?"</text>

  <g transform="translate(200, 330)">
    <!-- Shadow -->
    <ellipse cx="0" cy="85" rx="50" ry="10" fill="#000" opacity="0.3"/>

    <!-- Body - small, rusty robot -->
    <rect x="-30" y="-20" width="60" height="70" rx="8" fill="url(#rustMetal)" stroke="#5D4037" stroke-width="2"/>
    <!-- Rust patches -->
    <circle cx="-10" cy="10" r="8" fill="#795548" opacity="0.4"/>
    <circle cx="15" cy="25" r="6" fill="#795548" opacity="0.3"/>
    <!-- Chest plate (cracked) -->
    <rect x="-20" y="-10" width="40" height="30" rx="4" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <line x1="-5" y1="-5" x2="8" y2="15" stroke="#5D4037" stroke-width="1.5" opacity="0.6"/>
    <!-- Core (dimly glowing) -->
    <circle cx="0" cy="5" r="8" fill="#263238" stroke="#455A64" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="5" fill="#00E5FF" opacity="0.3"/>
    <circle cx="0" cy="5" r="3" fill="#00E5FF" opacity="0.2"/>

    <!-- Head -->
    <rect x="-22" y="-55" width="44" height="35" rx="6" fill="url(#rustMetal)" stroke="#5D4037" stroke-width="2"/>
    <!-- Visor -->
    <rect x="-16" y="-48" width="32" height="14" rx="3" fill="#263238" stroke="#455A64" stroke-width="1"/>
    <!-- Eyes (one dim, one flickering) -->
    <circle cx="-6" cy="-41" r="4" fill="#00E5FF" opacity="0.2"/>
    <circle cx="6" cy="-41" r="4" fill="#00E5FF" opacity="0.5"/>
    <circle cx="6" cy="-41" r="2" fill="#00E5FF" opacity="0.3"/>
    <!-- Antenna (bent) -->
    <line x1="0" y1="-55" x2="-8" y2="-70" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-8" cy="-70" r="3" fill="#A1887F"/>

    <!-- Arms (one hanging loose) -->
    <rect x="-42" y="-15" width="12" height="40" rx="4" fill="#8D6E63" stroke="#6D4C41" stroke-width="1.5"/>
    <rect x="30" y="-10" width="12" height="35" rx="4" fill="#8D6E63" stroke="#6D4C41" stroke-width="1.5" transform="rotate(15,36,5)"/>

    <!-- Legs -->
    <rect x="-22" y="50" width="14" height="25" rx="4" fill="#8D6E63" stroke="#6D4C41" stroke-width="1.5"/>
    <rect x="8" y="50" width="14" height="25" rx="4" fill="#8D6E63" stroke="#6D4C41" stroke-width="1.5"/>
    <!-- Feet -->
    <rect x="-26" y="72" width="22" height="10" rx="3" fill="#6D4C41"/>
    <rect x="4" y="72" width="22" height="10" rx="3" fill="#6D4C41"/>

    <!-- Dust/rust particles -->
    <circle cx="-35" cy="30" r="1.5" fill="#A1887F" opacity="0.5"/>
    <circle cx="38" cy="15" r="1" fill="#A1887F" opacity="0.4"/>
    <circle cx="-20" cy="60" r="1" fill="#A1887F" opacity="0.3"/>
  </g>

  <!-- Stage 2: Awakened -->
  <text x="600" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#00E5FF">Stage 3: Awakened</text>
  <text x="600" y="182" text-anchor="middle" font-size="10" fill="#546E7A">"기억해? 우리 같이 세상을 구했잖아!"</text>

  <g transform="translate(600, 320)">
    <ellipse cx="0" cy="95" rx="60" ry="12" fill="#00E5FF" opacity="0.1"/>

    <!-- Energy aura -->
    <circle cx="0" cy="10" r="80" fill="#00E5FF" opacity="0.03"/>
    <circle cx="0" cy="10" r="65" fill="#00E5FF" opacity="0.04"/>

    <!-- Body - restored, shining -->
    <rect x="-35" y="-25" width="70" height="80" rx="10" fill="url(#metalBody)" stroke="#90A4AE" stroke-width="2"/>
    <!-- Chest plate (restored) -->
    <rect x="-25" y="-15" width="50" height="35" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>
    <!-- Core (fully glowing) -->
    <circle cx="0" cy="2" r="12" fill="#263238" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="0" cy="2" r="8" fill="url(#energyCore)" opacity="0.8"/>
    <circle cx="0" cy="2" r="5" fill="#00E5FF" opacity="0.6"/>
    <circle cx="0" cy="2" r="3" fill="#FFF" opacity="0.4"/>

    <!-- Head -->
    <rect x="-28" y="-65" width="56" height="42" rx="8" fill="url(#metalBody)" stroke="#90A4AE" stroke-width="2"/>
    <!-- Visor (glowing) -->
    <rect x="-20" y="-58" width="40" height="18" rx="4" fill="#263238" stroke="#00E5FF" stroke-width="1.5"/>
    <!-- Eyes (both bright) -->
    <circle cx="-8" cy="-49" r="5" fill="#00E5FF" opacity="0.9"/>
    <circle cx="8" cy="-49" r="5" fill="#00E5FF" opacity="0.9"/>
    <circle cx="-8" cy="-49" r="3" fill="#FFF" opacity="0.5"/>
    <circle cx="8" cy="-49" r="3" fill="#FFF" opacity="0.5"/>
    <!-- Antenna (fixed, glowing tip) -->
    <line x1="0" y1="-65" x2="0" y2="-82" stroke="#B0BEC5" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-82" r="4" fill="#00E5FF" opacity="0.8"/>
    <circle cx="0" cy="-82" r="6" fill="#00E5FF" opacity="0.2"/>

    <!-- Shoulder armor -->
    <path d="M-35,-20 Q-50,-25 -48,-10 L-35,-5Z" fill="#78909C" stroke="#90A4AE" stroke-width="1.5"/>
    <path d="M35,-20 Q50,-25 48,-10 L35,-5Z" fill="#78909C" stroke="#90A4AE" stroke-width="1.5"/>

    <!-- Arms (strong) -->
    <rect x="-50" y="-18" width="15" height="45" rx="5" fill="url(#metalBody)" stroke="#78909C" stroke-width="1.5"/>
    <rect x="35" y="-18" width="15" height="45" rx="5" fill="url(#metalBody)" stroke="#78909C" stroke-width="1.5"/>
    <!-- Fists -->
    <rect x="-52" y="25" width="19" height="18" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>
    <rect x="33" y="25" width="19" height="18" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>

    <!-- Legs -->
    <rect x="-25" y="55" width="18" height="30" rx="5" fill="url(#metalBody)" stroke="#78909C" stroke-width="1.5"/>
    <rect x="7" y="55" width="18" height="30" rx="5" fill="url(#metalBody)" stroke="#78909C" stroke-width="1.5"/>
    <!-- Feet -->
    <rect x="-30" y="82" width="28" height="12" rx="4" fill="#607D8B" stroke="#78909C" stroke-width="1"/>
    <rect x="2" y="82" width="28" height="12" rx="4" fill="#607D8B" stroke="#78909C" stroke-width="1"/>

    <!-- Energy effects -->
    <line x1="-55" y1="-5" x2="-65" y2="-10" stroke="#00E5FF" stroke-width="1.5" opacity="0.4"/>
    <line x1="55" y1="-5" x2="65" y2="-10" stroke="#00E5FF" stroke-width="1.5" opacity="0.4"/>
    <circle cx="-60" cy="-5" r="2" fill="#00E5FF" opacity="0.3"/>
    <circle cx="60" cy="-5" r="2" fill="#00E5FF" opacity="0.3"/>
  </g>

  <!-- Evolution Arrow -->
  <g transform="translate(400, 300)">
    <path d="M-110,0 L110,0" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
    <text x="0" y="-10" text-anchor="middle" font-size="10" fill="#00E5FF" opacity="0.6">BOND DEEPENS</text>
  </g>

  <line x1="100" y1="475" x2="700" y2="475" stroke="#263238" stroke-width="1"/>

  <!-- Variations Row -->
  <text x="400" y="510" text-anchor="middle" font-size="16" font-weight="bold" fill="#78909C">Mecha Tribe Variations</text>

  <!-- Var 1: Tank type -->
  <g transform="translate(120, 640)">
    <circle cx="0" cy="0" r="48" fill="#263238" stroke="#37474F" stroke-width="1.5"/>
    <!-- Bulky tank bot -->
    <rect x="-22" y="-15" width="44" height="38" rx="6" fill="#607D8B"/>
    <rect x="-28" y="-8" width="10" height="20" rx="3" fill="#546E7A"/>
    <rect x="18" y="-8" width="10" height="20" rx="3" fill="#546E7A"/>
    <rect x="-16" y="-30" width="32" height="18" rx="5" fill="#78909C"/>
    <rect x="-10" y="-26" width="20" height="8" rx="2" fill="#263238"/>
    <circle cx="-3" cy="-22" r="2.5" fill="#FF6D00" opacity="0.8"/>
    <circle cx="5" cy="-22" r="2.5" fill="#FF6D00" opacity="0.8"/>
    <circle cx="0" cy="5" r="5" fill="#FF6D00" opacity="0.3"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#78909C">Tank Bot</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#546E7A">Defense Type</text>
  </g>

  <!-- Var 2: Flight type -->
  <g transform="translate(280, 640)">
    <circle cx="0" cy="0" r="48" fill="#263238" stroke="#37474F" stroke-width="1.5"/>
    <!-- Sleek flight bot -->
    <path d="M0,-25 L15,-5 L10,20 L-10,20 L-15,-5Z" fill="#90A4AE"/>
    <path d="M-15,-5 L-35,-15 L-25,0Z" fill="#78909C"/>
    <path d="M15,-5 L35,-15 L25,0Z" fill="#78909C"/>
    <rect x="-8" y="-22" width="16" height="12" rx="3" fill="#B0BEC5"/>
    <rect x="-5" y="-19" width="10" height="6" rx="2" fill="#263238"/>
    <circle cx="-2" cy="-16" r="2" fill="#00E5FF" opacity="0.8"/>
    <circle cx="3" cy="-16" r="2" fill="#00E5FF" opacity="0.8"/>
    <circle cx="0" cy="3" r="4" fill="#00E5FF" opacity="0.3"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#78909C">Sky Wing</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#546E7A">Speed Type</text>
  </g>

  <!-- Var 3: Repair type -->
  <g transform="translate(440, 640)">
    <circle cx="0" cy="0" r="48" fill="#263238" stroke="#37474F" stroke-width="1.5"/>
    <!-- Small round repair bot -->
    <circle cx="0" cy="0" r="20" fill="#B0BEC5"/>
    <circle cx="0" cy="0" r="15" fill="#CFD8DC"/>
    <circle cx="-5" cy="-4" r="3" fill="#263238"/>
    <circle cx="5" cy="-4" r="3" fill="#263238"/>
    <circle cx="-4" cy="-5" r="1" fill="#4CAF50"/>
    <circle cx="6" cy="-5" r="1" fill="#4CAF50"/>
    <path d="M-3,5 Q0,8 3,5" fill="none" stroke="#455A64" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Tool arm -->
    <line x1="18" y1="0" x2="30" y2="-8" stroke="#90A4AE" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="-8" r="4" fill="#4CAF50" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#4CAF50" opacity="0.15"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#78909C">Fix Bot</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#546E7A">Heal Type</text>
  </g>

  <!-- Var 4: Ancient/Legendary -->
  <g transform="translate(600, 640)">
    <circle cx="0" cy="0" r="48" fill="#263238" stroke="#FFD54F" stroke-width="2"/>
    <!-- Ancient mecha -->
    <rect x="-20" y="-15" width="40" height="45" rx="5" fill="#5D4037"/>
    <rect x="-14" y="-28" width="28" height="16" rx="4" fill="#6D4C41"/>
    <rect x="-10" y="-24" width="20" height="8" rx="2" fill="#3E2723"/>
    <circle cx="-3" cy="-20" r="3" fill="#FFD54F" opacity="0.9"/>
    <circle cx="5" cy="-20" r="3" fill="#FFD54F" opacity="0.9"/>
    <!-- Ancient runes -->
    <rect x="-12" y="-2" width="24" height="18" rx="3" fill="#4E342E" stroke="#FFD54F" stroke-width="0.8"/>
    <text x="0" y="11" text-anchor="middle" font-size="10" fill="#FFD54F" opacity="0.6">III</text>
    <!-- Wing remnants -->
    <path d="M-20,0 L-32,-10 L-28,5Z" fill="#8D6E63" opacity="0.6"/>
    <path d="M20,0 L32,-10 L28,5Z" fill="#8D6E63" opacity="0.6"/>
    <circle cx="0" cy="7" r="5" fill="#FFD54F" opacity="0.2"/>
    <text x="0" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFD54F">Ancient Gear</text>
    <text x="0" y="78" text-anchor="middle" font-size="8" fill="#BF8040">Legendary</text>
  </g>

  <!-- Concept note -->
  <rect x="80" y="750" width="640" height="55" rx="10" fill="#263238"/>
  <text x="400" y="772" text-anchor="middle" font-size="11" fill="#00E5FF">CONCEPT: "어릴 때 조립했던 프라모델, 로봇 장난감의 기억"</text>
  <text x="400" y="790" text-anchor="middle" font-size="10" fill="#546E7A">처음 발견하면 녹슬고 망가진 상태. 추억의 유대가 깊어질수록 빛나는 모습으로 복원된다.</text>

  <!-- Color palette -->
  <text x="400" y="835" text-anchor="middle" font-size="10" fill="#455A64">Color Palette</text>
  <rect x="250" y="845" width="30" height="18" rx="4" fill="#607D8B"/>
  <rect x="285" y="845" width="30" height="18" rx="4" fill="#B0BEC5"/>
  <rect x="320" y="845" width="30" height="18" rx="4" fill="#8D6E63"/>
  <rect x="355" y="845" width="30" height="18" rx="4" fill="#00E5FF"/>
  <rect x="390" y="845" width="30" height="18" rx="4" fill="#FF6D00"/>
  <rect x="425" y="845" width="30" height="18" rx="4" fill="#263238"/>
  <rect x="460" y="845" width="30" height="18" rx="4" fill="#FFD54F"/>
  <rect x="495" y="845" width="30" height="18" rx="4" fill="#4CAF50"/>

  <text x="400" y="890" text-anchor="middle" font-size="10" fill="#37474F">BarcodeQuest Monster Design Sheet - MECHA TYPE</text>
</svg>
