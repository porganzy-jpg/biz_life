<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" font-family="'Segoe UI', sans-serif">
  <rect width="800" height="850" fill="#FAFAF5"/>

  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Emotion-Based Type System</text>
  <text x="400" y="65" text-anchor="middle" font-size="13" fill="#999">Instead of Fire/Water/Grass — emotions define creature types</text>

  <!-- Type Circle Diagram -->
  <!-- Center -->
  <circle cx="400" cy="340" r="200" fill="none" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="400" cy="340" r="130" fill="none" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Joy Type (top) -->
  <g transform="translate(400, 155)">
    <circle cx="0" cy="0" r="42" fill="#FFF9C4" stroke="#FFD54F" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">☀️</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#F57F17">JOY</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#FFB300">Warmth &amp; Light</text>
  </g>

  <!-- Courage Type (top-right) -->
  <g transform="translate(570, 220)">
    <circle cx="0" cy="0" r="42" fill="#FFEBEE" stroke="#EF5350" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">🔥</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">COURAGE</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#E53935">Passion &amp; Will</text>
  </g>

  <!-- Wonder Type (right) -->
  <g transform="translate(600, 400)">
    <circle cx="0" cy="0" r="42" fill="#E8F5E9" stroke="#66BB6A" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">🌿</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">WONDER</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#43A047">Growth &amp; Discovery</text>
  </g>

  <!-- Memory Type (bottom-right) -->
  <g transform="translate(530, 510)">
    <circle cx="0" cy="0" r="42" fill="#FFF3E0" stroke="#FF9800" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">📷</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">MEMORY</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#F57C00">Nostalgia &amp; Time</text>
  </g>

  <!-- Comfort Type (bottom) -->
  <g transform="translate(400, 540)">
    <circle cx="0" cy="0" r="42" fill="#E3F2FD" stroke="#42A5F5" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">💧</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">COMFORT</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#1E88E5">Healing &amp; Tears</text>
  </g>

  <!-- Dream Type (bottom-left) -->
  <g transform="translate(270, 510)">
    <circle cx="0" cy="0" r="42" fill="#EDE7F6" stroke="#7E57C2" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">🌙</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#4527A0">DREAM</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#5E35B1">Night &amp; Imagination</text>
  </g>

  <!-- Bond Type (left) -->
  <g transform="translate(200, 400)">
    <circle cx="0" cy="0" r="42" fill="#FCE4EC" stroke="#EC407A" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">💕</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#AD1457">BOND</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#C2185B">Love &amp; Connection</text>
  </g>

  <!-- Grit Type (top-left) -->
  <g transform="translate(230, 220)">
    <circle cx="0" cy="0" r="42" fill="#EFEBE9" stroke="#8D6E63" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="22">🪨</text>
    <text x="0" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#4E342E">GRIT</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#6D4C41">Endurance &amp; Strength</text>
  </g>

  <!-- Center label -->
  <circle cx="400" cy="340" r="35" fill="#FFF" stroke="#DDD" stroke-width="1.5"/>
  <text x="400" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">HEART</text>
  <text x="400" y="350" text-anchor="middle" font-size="9" fill="#999">Core</text>

  <!-- Type advantage arrows (subtle) -->
  <!-- Joy > Comfort (sunshine dries tears) -->
  <path d="M420,195 Q490,250 560,240" fill="none" stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Courage > Dream (will overcomes nightmares) -->
  <path d="M555,260 Q580,400 530,490" fill="none" stroke="#EF5350" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Type interaction table -->
  <text x="400" y="625" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Type Interactions</text>
  <text x="400" y="645" text-anchor="middle" font-size="11" fill="#999">Emotional resonance instead of "super effective"</text>

  <!-- Interaction examples -->
  <rect x="50" y="665" width="220" height="55" rx="8" fill="#FFF9C4" opacity="0.5" stroke="#FFD54F" stroke-width="1"/>
  <text x="160" y="685" text-anchor="middle" font-size="10" font-weight="bold" fill="#F57F17">JOY inspires COURAGE</text>
  <text x="160" y="700" text-anchor="middle" font-size="9" fill="#FFB300">Happiness gives strength to be brave</text>

  <rect x="290" y="665" width="220" height="55" rx="8" fill="#E3F2FD" opacity="0.5" stroke="#42A5F5" stroke-width="1"/>
  <text x="400" y="685" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">COMFORT soothes MEMORY</text>
  <text x="400" y="700" text-anchor="middle" font-size="9" fill="#42A5F5">Healing embraces painful memories</text>

  <rect x="530" y="665" width="220" height="55" rx="8" fill="#FCE4EC" opacity="0.5" stroke="#EC407A" stroke-width="1"/>
  <text x="640" y="685" text-anchor="middle" font-size="10" font-weight="bold" fill="#AD1457">BOND awakens DREAM</text>
  <text x="640" y="700" text-anchor="middle" font-size="9" fill="#E91E63">Connection makes dreams worth having</text>

  <rect x="170" y="735" width="220" height="55" rx="8" fill="#EDE7F6" opacity="0.5" stroke="#7E57C2" stroke-width="1"/>
  <text x="280" y="755" text-anchor="middle" font-size="10" font-weight="bold" fill="#4527A0">DREAM fuels WONDER</text>
  <text x="280" y="770" text-anchor="middle" font-size="9" fill="#7E57C2">Imagination sparks curiosity</text>

  <rect x="410" y="735" width="220" height="55" rx="8" fill="#EFEBE9" opacity="0.5" stroke="#8D6E63" stroke-width="1"/>
  <text x="520" y="755" text-anchor="middle" font-size="10" font-weight="bold" fill="#4E342E">GRIT protects BOND</text>
  <text x="520" y="770" text-anchor="middle" font-size="9" fill="#8D6E63">Perseverance keeps connections alive</text>

  <text x="400" y="820" text-anchor="middle" font-size="11" fill="#CCC">BarcodeQuest - Emotion Type System</text>
  <text x="400" y="838" text-anchor="middle" font-size="10" fill="#DDD">Types interact through emotional logic, not elemental weakness</text>
</svg>
