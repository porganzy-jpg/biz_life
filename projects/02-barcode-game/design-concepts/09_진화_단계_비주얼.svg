<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="evo1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="evo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="evo3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="#1E1E2E"/>

  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFF">Evolution Visual Progression</text>
  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#888">Creature grows visually as emotional bond deepens</text>

  <!-- Stage 1: Seed -->
  <g transform="translate(100, 250)">
    <circle cx="0" cy="0" r="55" fill="#2A2A3E" stroke="#444" stroke-width="2"/>
    <!-- Simple small creature -->
    <circle cx="0" cy="5" r="22" fill="url(#evo1)"/>
    <circle cx="-6" cy="0" r="3" fill="#888"/>
    <circle cx="6" cy="0" r="3" fill="#888"/>
    <path d="M-4,8 Q0,12 4,8" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tiny buds -->
    <circle cx="-12" cy="-18" r="4" fill="#C8E6C9" opacity="0.6"/>
    <circle cx="12" cy="-18" r="4" fill="#C8E6C9" opacity="0.6"/>

    <text x="0" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#AAA">Stage 1</text>
    <text x="0" y="92" text-anchor="middle" font-size="11" fill="#666">Seed</text>
    <text x="0" y="108" text-anchor="middle" font-size="9" fill="#555">Lv. 1~9</text>
    <text x="0" y="125" text-anchor="middle" font-size="9" fill="#444">Simple, small, basic colors</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(195, 245)">
    <path d="M0,0 L40,0" fill="none" stroke="#FFD54F" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="40,-5 50,0 40,5" fill="#FFD54F"/>
    <text x="25" y="-10" text-anchor="middle" font-size="9" fill="#FFD54F">Bond Lv.10</text>
  </g>

  <!-- Stage 2: Bloom -->
  <g transform="translate(310, 250)">
    <circle cx="0" cy="0" r="55" fill="#2A2A3E" stroke="#42A5F5" stroke-width="2"/>
    <!-- Bigger, more detailed creature -->
    <circle cx="0" cy="0" r="28" fill="url(#evo2)"/>
    <circle cx="0" cy="0" r="22" fill="#E3F2FD"/>
    <circle cx="-7" cy="-5" r="4" fill="#1565C0"/>
    <circle cx="7" cy="-5" r="4" fill="#1565C0"/>
    <circle cx="-5" cy="-6" r="1.5" fill="#FFF"/>
    <circle cx="9" cy="-6" r="1.5" fill="#FFF"/>
    <path d="M-5,6 Q0,11 5,6" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Leaf ears grown -->
    <ellipse cx="-18" cy="-22" rx="10" ry="6" fill="#66BB6A" transform="rotate(-20,-18,-22)"/>
    <ellipse cx="18" cy="-22" rx="10" ry="6" fill="#66BB6A" transform="rotate(20,18,-22)"/>
    <!-- Small flowers -->
    <circle cx="-25" cy="-10" r="4" fill="#FF69B4" opacity="0.5"/>
    <circle cx="25" cy="-12" r="3" fill="#FFD54F" opacity="0.5"/>
    <!-- Sparkle -->
    <circle cx="20" cy="-30" r="2" fill="#42A5F5" opacity="0.6"/>

    <text x="0" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#42A5F5">Stage 2</text>
    <text x="0" y="92" text-anchor="middle" font-size="11" fill="#64B5F6">Bloom</text>
    <text x="0" y="108" text-anchor="middle" font-size="9" fill="#555">Lv. 10~24</text>
    <text x="0" y="125" text-anchor="middle" font-size="9" fill="#444">Details emerge, colors deepen</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(405, 245)">
    <path d="M0,0 L40,0" fill="none" stroke="#FFD54F" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="40,-5 50,0 40,5" fill="#FFD54F"/>
    <text x="25" y="-10" text-anchor="middle" font-size="9" fill="#FFD54F">Bond Lv.25</text>
  </g>

  <!-- Stage 3: Radiance -->
  <g transform="translate(520, 250)">
    <circle cx="0" cy="0" r="55" fill="#2A2A3E" stroke="#AB47BC" stroke-width="2.5"/>
    <!-- Radiant glow -->
    <circle cx="0" cy="0" r="48" fill="#CE93D8" opacity="0.1"/>
    <circle cx="0" cy="0" r="40" fill="#CE93D8" opacity="0.08"/>
    <!-- Evolved creature -->
    <circle cx="0" cy="-3" r="30" fill="#E1BEE7"/>
    <circle cx="0" cy="-3" r="25" fill="#F3E5F5"/>
    <circle cx="-8" cy="-8" r="4.5" fill="#6A1B9A"/>
    <circle cx="8" cy="-8" r="4.5" fill="#6A1B9A"/>
    <circle cx="-6" cy="-9" r="1.8" fill="#FFF"/>
    <circle cx="10" cy="-9" r="1.8" fill="#FFF"/>
    <path d="M-6,5 Q0,11 6,5" fill="none" stroke="#6A1B9A" stroke-width="2" stroke-linecap="round"/>
    <!-- Wings/aura -->
    <path d="M-28,-5 Q-40,-20 -30,-30 Q-20,-35 -18,-15" fill="#CE93D8" opacity="0.4"/>
    <path d="M28,-5 Q40,-20 30,-30 Q20,-35 18,-15" fill="#CE93D8" opacity="0.4"/>
    <!-- Floral crown -->
    <circle cx="-12" cy="-30" r="5" fill="#FF69B4" opacity="0.7"/>
    <circle cx="0" cy="-33" r="5" fill="#FFD54F" opacity="0.7"/>
    <circle cx="12" cy="-30" r="5" fill="#FF8A65" opacity="0.7"/>
    <!-- Sparkles -->
    <text x="-35" y="-25" font-size="10" fill="#CE93D8" opacity="0.7">*</text>
    <text x="35" y="-30" font-size="8" fill="#CE93D8" opacity="0.5">*</text>
    <text x="30" y="15" font-size="6" fill="#CE93D8" opacity="0.6">*</text>

    <text x="0" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#AB47BC">Stage 3</text>
    <text x="0" y="92" text-anchor="middle" font-size="11" fill="#CE93D8">Radiance</text>
    <text x="0" y="108" text-anchor="middle" font-size="9" fill="#555">Lv. 25+</text>
    <text x="0" y="125" text-anchor="middle" font-size="9" fill="#444">Aura, wings, crown elements</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(615, 245)">
    <path d="M0,0 L40,0" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="5,3"/>
    <polygon points="40,-5 50,0 40,5" fill="#FFD700"/>
    <text x="25" y="-10" text-anchor="middle" font-size="9" fill="#FFD700">Max Bond</text>
  </g>

  <!-- Stage 4: Ascend -->
  <g transform="translate(710, 250)">
    <circle cx="0" cy="0" r="55" fill="#2A2A3E" stroke="#FFD54F" stroke-width="3"/>
    <!-- Golden glow -->
    <circle cx="0" cy="0" r="50" fill="#FFD54F" opacity="0.06"/>
    <circle cx="0" cy="0" r="42" fill="#FFD54F" opacity="0.05"/>
    <!-- Ascended creature -->
    <circle cx="0" cy="-5" r="28" fill="#FFE082"/>
    <circle cx="0" cy="-5" r="23" fill="#FFFDE7"/>
    <circle cx="-8" cy="-10" r="4.5" fill="#E65100"/>
    <circle cx="8" cy="-10" r="4.5" fill="#E65100"/>
    <circle cx="-6" cy="-11" r="2" fill="#FFF"/>
    <circle cx="10" cy="-11" r="2" fill="#FFF"/>
    <path d="M-6,3 Q0,10 6,3" fill="none" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
    <!-- Halo -->
    <ellipse cx="0" cy="-38" rx="18" ry="5" fill="none" stroke="#FFD54F" stroke-width="1.5" opacity="0.7"/>
    <!-- Majestic wings -->
    <path d="M-25,-8 Q-45,-30 -35,-42 Q-22,-48 -15,-25" fill="#FFD54F" opacity="0.4"/>
    <path d="M25,-8 Q45,-30 35,-42 Q22,-48 15,-25" fill="#FFD54F" opacity="0.4"/>
    <path d="M-20,-5 Q-35,-22 -28,-32 Q-18,-36 -12,-18" fill="#FFE082" opacity="0.5"/>
    <path d="M20,-5 Q35,-22 28,-32 Q18,-36 12,-18" fill="#FFE082" opacity="0.5"/>
    <!-- Extra sparkles -->
    <text x="-38" y="-18" font-size="12" fill="#FFD54F" opacity="0.7">+</text>
    <text x="35" y="-35" font-size="10" fill="#FFD54F" opacity="0.5">+</text>
    <text x="-30" y="15" font-size="8" fill="#FFD54F" opacity="0.6">+</text>
    <text x="38" y="10" font-size="6" fill="#FFD54F" opacity="0.8">+</text>

    <text x="0" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFD54F">Stage 4</text>
    <text x="0" y="92" text-anchor="middle" font-size="11" fill="#FFE082">Ascend</text>
    <text x="0" y="108" text-anchor="middle" font-size="9" fill="#555">Max Level</text>
    <text x="0" y="125" text-anchor="middle" font-size="9" fill="#444">Full aura, halo, grand form</text>
  </g>

  <!-- Bottom note -->
  <rect x="100" y="440" width="600" height="60" rx="10" fill="#2A2A3E"/>
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#FFE082">Evolution is driven by emotional bond, not combat</text>
  <text x="400" y="485" text-anchor="middle" font-size="10" fill="#888">Daily interactions, story completion, and care → deeper bond → visual evolution</text>

  <text x="400" y="530" text-anchor="middle" font-size="11" fill="#555">BarcodeQuest - Evolution Visual Progression</text>
</svg>
