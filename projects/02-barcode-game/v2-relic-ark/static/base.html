<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잔해 방주 · 거점</title>
<meta name="screen-orientation" content="landscape">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<div id="base">

  <!-- 화면 가운데는 언제나 거점이다. UI 는 가장자리에만 (REF_CROSS_SECTION §1-9) -->
  <canvas id="cv" aria-label="방주 단면"></canvas>

  <!-- S12-B2 UI 단순화(docs/UI_SIMPLE.md): 고정 UI 는 위 한 줄 + 오른쪽 아래 버튼 둘(찍기·≡)뿐.
       나머지는 ≡ 메뉴·탭 카드 안에 숨는다(지우지 않는다). -->
  <header class="topbar" id="topbar">
    <div class="tres" id="resbar"></div>
    <div class="tday"><span class="day" id="dayline">Day —</span><span class="act" id="actline">1막</span></div>
    <!-- 습격 띠: 생물 그림자 + 한 줄 + 노려지는 방. 누르면 작은 카드(#raidbar)가 펼쳐진다 -->
    <button class="rstrip" id="rstrip" hidden aria-expanded="false">
      <i class="rsil" id="rsil"></i><span class="rsline" id="rsline">—</span><b class="rsmore">▸</b>
    </button>
    <!-- 공기·깊이: 작은 아이콘 하나. 누르면 띠가 펼쳐진다 -->
    <!-- S13-B: 오늘의 쪽지(사건). 있을 때만 뜬다. 누르면 작은 카드 -->
    <button class="evbtn" id="evbtn" hidden title="오늘의 쪽지"><i>✉</i><span id="evline">쪽지</span></button>
    <button class="gaugebtn" id="gaugebtn" title="공기 · 깊이" aria-expanded="false"><span class="gmini" id="gmini"></span></button>
  </header>
  <div class="gaugepop" id="gaugepop" hidden>
    <div class="g" id="gAir"><span class="gk">공기</span><div class="band" id="bandAir"></div></div>
    <div class="g" id="gDepth"><span class="gk">깊이</span><div class="band down" id="bandDepth"></div><span class="gz" id="zoneline">무광층</span></div>
  </div>

  <!-- 습격 카드: 띠를 누르면 위 가운데에 펼쳐진다. 소리 → 실루엣 → 접촉. 시계는 없다(COMBAT_AND_DEFENSE §6-2·§9) -->
  <aside class="raidbar" id="raidbar" hidden>
    <div class="rtop">
      <span class="rstage" id="rstage">소리</span>
      <span class="rwho" id="rwho">—</span>
      <button class="rclose" id="rclose" aria-label="접기">×</button>
    </div>
    <ol class="rsteps" id="rsteps"><li>소리</li><li>실루엣</li><li>접촉</li></ol>
    <p class="rtext" id="rtext"></p>
    <div class="rhow" id="rhow"></div>
    <div class="rgate" id="rgate"></div>
    <!-- 반전: 먼저 배운 정답이 여기서는 오답이다(거울눈·덮개) -->
    <div class="rflip" id="rflip" hidden></div>
    <!-- 관문 행동: 토글로 안 되는 일곱 중 그 생물의 하나. 대가는 누르는 자리에서 낸다 -->
    <div class="ract" id="ract" hidden></div>
    <div class="rwould" id="rwould"></div>
    <button class="radv" id="radv">귀 기울이기</button>
    <p class="rhint" id="rhint"></p>
  </aside>

  <!-- 오른쪽 아래 둘: 찍기(이 게임의 훅 — J5·E1) · ≡ 메뉴 -->
  <div class="brbtns">
    <button class="scanbtn" id="scanbtn" title="바코드 찍기">찍기</button>
    <button class="menubtn" id="menubtn" title="메뉴" aria-expanded="false">≡</button>
  </div>
  <!-- ≡ 메뉴: 창고(자원 전부)·전원·공방·들이기·열쇠 -->
  <div class="menu" id="menu" hidden>
    <h3>창고</h3>
    <div class="mres" id="mres"></div>
    <div class="mbtns">
      <button id="pwr" class="sw" title="돔 전원">전원 켜짐</button>
      <button id="wbtn" class="sw" title="공방">공방</button>
      <button id="recallbtn" class="sw warn" title="밖에 계신 분 들이기" hidden>들이기</button>
      <button id="keybtn" class="sw" title="복구 코드 · 다른 기계에서 이어 하기">열쇠</button>
      <button id="codexbtn" class="sw" title="도감">도감</button>
      <button id="rumorbtn" class="sw" title="소문">소문</button>
      <button id="dayendbtn" class="sw" title="오늘 마감">오늘 마감</button>
    </div>
  </div>

  <!-- 줌: PC 에서만(폰은 핀치) -->
  <div class="zoomctl" id="zoomctl">
    <button id="zin" title="확대">+</button>
    <button id="zout" title="축소">−</button>
    <button id="zfit" title="맞춤">⌖</button>
  </div>

  <!-- 방을 누르면 그 방 위에 뜨는 작은 카드 -->
  <div class="roomcard" id="roomcard" hidden></div>
  <!-- 생산 방울이 HUD 로 날아가는 아이콘 -->
  <div class="flyers" id="flyers"></div>

  <!-- 상세 / 증축 / 공방 패널 -->
  <aside class="panel" id="panel" hidden>
    <button class="close" id="panelClose" aria-label="닫기">×</button>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <!-- 집은 사람 (탭-탭 배치의 손) -->
  <div class="carry" id="carry" hidden></div>

  <!-- 찍기 화면: 카메라 → 카드가 뒤집힌다 → 선반에 놓는다 (PLAYER_JOURNEY J5) -->
  <div class="scan" id="scan" hidden>
    <div class="scan-in">
      <button class="close" id="scanClose" aria-label="닫기">×</button>
      <div id="scanCam">
        <p class="sub">성문 해독</p>
        <h2>물건의 줄무늬를 비춰 주세요</h2>
        <div class="cam" id="cam"><video id="video" playsinline muted></video><div class="reticle"></div>
          <div class="camstatus" id="camstatus">카메라 준비 중…</div></div>
        <div class="manual">
          <input id="manual" inputmode="numeric" autocomplete="off" placeholder="바코드 숫자 8~13자리" maxlength="14">
          <button id="manualBtn">읽기</button>
        </div>
        <div class="samples" id="samples" hidden></div>
        <div class="picker" id="picker" hidden></div>
        <p class="quota" id="quota"></p>
      </div>
      <div id="scanCard" hidden>
        <div class="rcard" id="rcard"><div class="rc-in">
          <div class="rc-face rc-back"><span>RELIC</span><em>바다가 보관한 것</em></div>
          <div class="rc-face rc-front" id="rcFront"></div>
        </div></div>
        <div class="rgain" id="rgain"></div>
        <button class="shelfbtn" id="shelfBtn">선반에 두기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 폰 세로: 가로로 돌려 달라는 부드러운 안내(S12-B). 닫으면 세로로도 쓸 수 있다 -->
  <div class="rotate" id="rotate" hidden>
    <div class="rotate-in">
      <div class="phone-ico" aria-hidden="true"></div>
      <p>폰을 <b>가로로</b> 돌리시면 돔과 바깥 심연이 한 화면에 들어옵니다.</p>
      <button id="rotateOk">세로로 계속</button>
    </div>
  </div>
</div>
<script src="/static/movement.js"></script>
<script src="/static/m5map.js"></script>
<script src="/static/base.js"></script>
<script src="/static/base_collect.js"></script>
</body>
</html>
