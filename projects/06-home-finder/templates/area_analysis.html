{% extends "base.html" %}
{% block title %}지역 분석{% endblock %}
{% block nav_areas %}active{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col-12">
        <h4><i class="bi bi-bar-chart"></i> 지역 비교 분석</h4>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-4">
        <label class="form-label">지역 1</label>
        <select id="area1" class="form-select">
            <option value="마포구">마포구</option>
            <option value="용산구">용산구</option>
            <option value="성동구">성동구</option>
            <option value="광진구">광진구</option>
            <option value="영등포구">영등포구</option>
            <option value="동작구">동작구</option>
            <option value="강동구">강동구</option>
            <option value="은평구">은평구</option>
            <option value="강서구">강서구</option>
            <option value="노원구">노원구</option>
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">지역 2</label>
        <select id="area2" class="form-select">
            <option value="용산구">용산구</option>
            <option value="마포구">마포구</option>
            <option value="성동구">성동구</option>
            <option value="광진구">광진구</option>
            <option value="영등포구">영등포구</option>
            <option value="동작구">동작구</option>
            <option value="강동구">강동구</option>
            <option value="은평구">은평구</option>
            <option value="강서구">강서구</option>
            <option value="노원구">노원구</option>
        </select>
    </div>
    <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-primary w-100" onclick="compareAreas()">
            <i class="bi bi-arrow-left-right"></i> 비교하기
        </button>
    </div>
</div>

<div class="row" id="comparisonResult" style="display:none">
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-header" id="area1Name">지역 1</div>
            <div class="card-body" id="area1Info"></div>
        </div>
    </div>
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-header" id="area2Name">지역 2</div>
            <div class="card-body" id="area2Info"></div>
        </div>
    </div>
    <div class="col-12 mb-3">
        <div class="card">
            <div class="card-header"><i class="bi bi-graph-up"></i> 가격 비교</div>
            <div class="card-body">
                <canvas id="areaCompareChart" height="250"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- All Districts Overview -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header"><i class="bi bi-grid-3x3"></i> 전체 지역 현황</div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>지역</th>
                            <th>평균 m2가격</th>
                            <th>1년 변동</th>
                            <th>매물 수</th>
                            <th>지하철역</th>
                            <th>공원</th>
                            <th>종합점수</th>
                        </tr>
                    </thead>
                    <tbody id="allDistrictsTable">
                        <tr><td colspan="7" class="text-center text-muted">로딩중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/charts.js"></script>
<script>
async function compareAreas() {
    const d1 = document.getElementById('area1').value;
    const d2 = document.getElementById('area2').value;
    const resp = await fetch(`/api/v1/areas/compare?district1=${encodeURIComponent(d1)}&district2=${encodeURIComponent(d2)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    document.getElementById('comparisonResult').style.display = '';
    document.getElementById('area1Name').textContent = d1;
    document.getElementById('area2Name').textContent = d2;
    renderAreaInfo('area1Info', data.area1 || {});
    renderAreaInfo('area2Info', data.area2 || {});
}

function renderAreaInfo(elemId, area) {
    const el = document.getElementById(elemId);
    el.innerHTML = `
        <table class="table table-sm">
            <tr><th>평균 m2가격</th><td>${area.avg_price_per_m2 ? Math.round(area.avg_price_per_m2/10000)+'만' : '-'}</td></tr>
            <tr><th>1년 변동</th><td>${area.price_change_1y ? area.price_change_1y.toFixed(1)+'%' : '-'}</td></tr>
            <tr><th>지하철역</th><td>${area.subway_count || '-'}개</td></tr>
            <tr><th>공원</th><td>${area.park_count || '-'}개</td></tr>
            <tr><th>개발계획</th><td>${area.development_plan || '-'}</td></tr>
            <tr><th>종합점수</th><td class="fw-bold">${area.area_composite_score ? area.area_composite_score.toFixed(1) : '-'}</td></tr>
        </table>`;
}

async function loadAllDistricts() {
    const resp = await fetch('/api/v1/areas/');
    if (!resp.ok) return;
    const districts = await resp.json();
    const tbody = document.getElementById('allDistrictsTable');
    tbody.innerHTML = '';
    for (const d of (districts.items || districts || [])) {
        tbody.innerHTML += `<tr>
            <td><a href="#" onclick="document.getElementById('area1').value='${d.district}'">${d.district}</a></td>
            <td>${d.avg_price_per_m2 ? Math.round(d.avg_price_per_m2/10000)+'만' : '-'}</td>
            <td class="${(d.price_change_1y||0)>=0?'text-success':'text-danger'}">${d.price_change_1y ? d.price_change_1y.toFixed(1)+'%' : '-'}</td>
            <td>${d.property_count || '-'}</td>
            <td>${d.subway_count || '-'}</td>
            <td>${d.park_count || '-'}</td>
            <td>${d.area_composite_score ? d.area_composite_score.toFixed(1) : '-'}</td>
        </tr>`;
    }
}

loadAllDistricts();
</script>
{% endblock %}
