<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HomeFinder{% endblock %} - 마지막 집 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-house-heart"></i> HomeFinder
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="/">
                            <i class="bi bi-speedometer2"></i> 대시보드
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_search %}{% endblock %}" href="/search">
                            <i class="bi bi-sliders"></i> 내 조건
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_map %}{% endblock %}" href="/map">
                            <i class="bi bi-geo-alt"></i> 지도
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_candidates %}{% endblock %}" href="/candidates">
                            <i class="bi bi-kanban"></i> 후보관리
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_areas %}{% endblock %}" href="/areas">
                            <i class="bi bi-bar-chart"></i> 지역분석
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-collection"></i> 더보기
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/property/new/land"><i class="bi bi-plus-circle"></i> 매물 등록</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/api/v1/auctions/upcoming">경매일정</a></li>
                            <li><a class="dropdown-item" href="/api/v1/subscriptions">청약정보</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/docs">API 문서</a></li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link text-muted" id="lastUpdate"></span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
